syntax = "proto3";

package agent.v1;

option go_package = "ebof-wg-mesh/api/proto/agentv1;agentv1";

import "google/protobuf/timestamp.proto";
import "platform.proto";

message AgentHello {
  string agent_id = 1;
  string name = 2;
  string advertise_addr = 3;
  int64 cpu_millis_capacity = 4;
  int64 memory_mebibytes_capacity = 5;
  string wireguard_public_key = 6;
  int32 wireguard_listen_port = 7;
  repeated string runtime_capabilities = 8;
  string software_version = 9;
  // A fresh opaque identity for this stream incarnation. Reconnecting with a
  // new session fences reports and heartbeats from an older stream.
  string session_id = 10;
  // Last durable control-plane position accepted by the agent. These fields
  // describe local inventory; the connection does not own that state.
  uint64 accepted_authority_epoch = 11;
  int64 reconciliation_cursor = 12;
  bool recovery_mode = 13;
  repeated RuntimeResource runtime_resources = 14;
  string cluster_id = 15;
  string local_store_id = 16;
  string initialization_state = 17;
  repeated ServiceCondition allocations = 18;
  // Durably incremented before each hello; prevents delayed hello replay.
  uint64 session_incarnation = 19;
}

message RuntimeResource {
  string allocation_id = 1;
  string runtime_id = 2;
  string volume_id = 3;
}

message EnrollRequest {
  string agent_id = 1;
  string csr_pem = 2;
  string bootstrap_token = 3;
}

message EnrollResponse {
  string cert_pem = 1;
  string ca_pem = 2;
  google.protobuf.Timestamp not_after = 3;
}

message ManagedDashboardCertificateRequest {
  string agent_id = 1;
  string csr_pem = 2;
}

message WireGuardPeer {
  string agent_id = 1;
  string name = 2;
  string public_key = 3;
  string endpoint = 4;
  repeated string allowed_ips = 5;
  int32 persistent_keepalive_seconds = 6;
}

message AssignedNodeConfig {
  string workload_ipv6_subnet = 1;
  string wireguard_interface_name = 2;
  repeated string wireguard_addresses = 3;
  int32 wireguard_listen_port = 4;
  repeated WireGuardPeer peers = 5;
  repeated WorkloadIdentity workload_identities = 6;
  string workload_ipv6_pool = 7;
  string workload_ipv4_subnet = 8;
  string workload_ipv4_pool = 9;
}

message WorkloadIdentity {
  string workload_ipv6 = 1;
  string environment_id = 2;
  uint32 network_identity = 3;
  string host_agent_id = 4;
  string host_ipv6 = 5;
  string workload_ipv4 = 6;
}

message AgentHeartbeat {
  string agent_id = 1;
  string session_id = 2;
  bool recovery_mode = 3;
}

message DesiredVolume {
  string volume_id = 1;
  string environment_id = 2;
  string name = 3;
  int64 size_bytes = 4;
}

message DesiredService {
  string allocation_id = 1;
  string service_id = 2;
  string environment_id = 3;
  string name = 4;
  int64 desired_spec_revision = 5;
  platform.v1.ResolvedServiceSpec spec = 6;
  string private_ipv6 = 7;
  string volume_id = 8;
  int64 desired_rollout_generation = 9;
  uint32 network_identity = 10;
  // Exact-repository pull credential for a platform-built private image.
  string registry_username = 11;
  string registry_password = 12;
  string internal_hostname = 13;
  repeated InternalHost internal_hosts = 14;
  // Last persisted restart observation from the control plane. The agent
  // uses this after a local data-dir loss; local files still win when newer.
  platform.v1.RestartObservation restart_observation = 15;
  int64 operator_restart_nonce = 16;
  AllocationIntent intent = 17;
  google.protobuf.Timestamp drain_deadline = 18;
  string private_ipv4 = 19;
  string deployment_id = 20;
}

enum AllocationIntent {
  ALLOCATION_INTENT_UNSPECIFIED = 0;
  ALLOCATION_INTENT_RUN = 1;
  ALLOCATION_INTENT_DRAIN = 2;
}

message InternalHost {
  string hostname = 1;
  string ipv6 = 2;
  string ipv4 = 3;
}

message DesiredNodeState {
  string agent_id = 1;
  int64 reconciliation_cursor = 2;
  repeated DesiredVolume volumes = 3;
  repeated DesiredService services = 4;
  google.protobuf.Timestamp generated_at = 5;
  AssignedNodeConfig node_config = 6;
  uint64 authority_epoch = 7;
  // Only a complete AGENT scope permits removal by omission.
  SnapshotScope scope = 8;
  bool complete = 9;
  string session_id = 10;
  google.protobuf.Timestamp authority_not_after = 11;
  string cluster_id = 12;
}

enum SnapshotScope {
  SNAPSHOT_SCOPE_UNSPECIFIED = 0;
  SNAPSHOT_SCOPE_AGENT = 1;
}

// Sent only after the desired snapshot and its cursor are durably committed.
// Does not imply runtime success or release of any allocation or volume.
message DesiredStateAcknowledgement {
  string agent_id = 1;
  string session_id = 2;
  uint64 authority_epoch = 3;
  int64 reconciliation_cursor = 4;
}

message VolumeCondition {
  string volume_id = 1;
  string phase = 2;
  string message = 3;
}

message ServiceCondition {
  string allocation_id = 1;
  string service_id = 2;
  int64 desired_spec_revision = 3;
  int64 applied_spec_revision = 4;
  string phase = 5;
  string message = 6;
  string allocation_ipv4 = 7;
  bool healthy = 8;
  int64 desired_rollout_generation = 9;
  int64 applied_rollout_generation = 10;
  repeated int32 healthy_ipv4_ports = 11;
  platform.v1.RestartObservation restart = 12;
  string allocation_ipv6 = 13;
  repeated int32 healthy_ipv6_ports = 14;
}

message StatusReport {
  string agent_id = 1;
  repeated VolumeCondition volumes = 2;
  repeated ServiceCondition services = 3;
  string session_id = 4;
  uint64 observation_sequence = 5;
  uint64 authority_epoch = 6;
  int64 reconciliation_cursor = 7;
  bool recovery_mode = 8;
}

message LogEntry {
  google.protobuf.Timestamp observed_at = 1;
  string environment_id = 2;
  string service_id = 3;
  string allocation_id = 4;
  string stream = 5;
  int64 rollout_generation = 6;
  uint64 sequence = 7;
  string line = 8;
  platform.v1.ServiceLogType log_type = 9;
  string build_id = 10;
  string stage = 11;
}

message LogBatch {
  string agent_id = 1;
  repeated LogEntry entries = 2;
}

message AgentClientMessage {
  oneof payload {
    AgentHello hello = 1;
    AgentHeartbeat heartbeat = 2;
    StatusReport status_report = 3;
    LogBatch log_batch = 4;
    DesiredStateAcknowledgement acknowledgement = 5;
  }
}

message AgentServerMessage {
  oneof payload {
    DesiredNodeState desired_state = 1;
  }
}

service AgentControl {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc IssueManagedDashboardCertificate(ManagedDashboardCertificateRequest) returns (EnrollResponse);
  rpc Sync(stream AgentClientMessage) returns (stream AgentServerMessage);
}
