syntax = "proto3";

package agent.v1;

option go_package = "ebof-wg-mesh/api/proto/agentv1;agentv1";

import "google/protobuf/timestamp.proto";
import "platform.proto";

message AgentHello {
  string agent_id = 1;
  string name = 2;
  string advertise_addr = 3;
  int64 cpu_millis_capacity = 4;
  int64 memory_mebibytes_capacity = 5;
  string wireguard_public_key = 6;
  int32 wireguard_listen_port = 7;
  repeated string runtime_capabilities = 8;
  string software_version = 9;
  string session_id = 10;
  // Last durable control-plane position accepted by the agent. These fields
  // describe local inventory; the connection does not own that state.
  // reconciliation_cursor is the accepted per-node allocation revision
  // (monotonic). The other accepted_*_version fields are content-hash
  // versions of accepted content; empty means none accepted. The observation
  // overlay version covers the observation-derived fields of accepted
  // services (internal hosts, restart observations), which can drift at the
  // same reconciliation cursor and are repaired with a checkpoint.
  uint64 accepted_authority_epoch = 11;
  int64 reconciliation_cursor = 12;
  bool recovery_mode = 13;
  repeated RuntimeResource runtime_resources = 14;
  string cluster_id = 15;
  string local_store_id = 16;
  string initialization_state = 17;
  repeated ServiceCondition allocations = 18;
  uint64 session_incarnation = 19;
  string wireguard_endpoint = 20;
  string accepted_node_config_version = 21;
  string accepted_credentials_version = 22;
  string accepted_replicas_version = 23;
  string accepted_observation_overlay_version = 24;
}

message RuntimeResource {
  string allocation_id = 1;
  string runtime_id = 2;
  string volume_id = 3;
}

message EnrollRequest {
  string agent_id = 1;
  string csr_pem = 2;
  string bootstrap_token = 3;
}

message EnrollResponse {
  string cert_pem = 1;
  string ca_pem = 2;
  google.protobuf.Timestamp not_after = 3;
  repeated string replica_addresses = 4;
}

message ManagedDashboardCertificateRequest {
  string agent_id = 1;
  string csr_pem = 2;
}

message WireGuardPeer {
  string agent_id = 1;
  string name = 2;
  string public_key = 3;
  string endpoint = 4;
  repeated string allowed_ips = 5;
  int32 persistent_keepalive_seconds = 6;
}

message AssignedNodeConfig {
  string workload_ipv6_subnet = 1;
  string wireguard_interface_name = 2;
  repeated string wireguard_addresses = 3;
  int32 wireguard_listen_port = 4;
  repeated WireGuardPeer peers = 5;
  repeated WorkloadIdentity workload_identities = 6;
  string workload_ipv6_pool = 7;
  string workload_ipv4_subnet = 8;
  string workload_ipv4_pool = 9;
}

message WorkloadIdentity {
  string workload_ipv6 = 1;
  string environment_id = 2;
  uint32 network_identity = 3;
  string host_agent_id = 4;
  string host_ipv6 = 5;
  string workload_ipv4 = 6;
}

message AgentHeartbeat {
  string agent_id = 1;
  string session_id = 2;
  bool recovery_mode = 3;
}

message DesiredVolume {
  string volume_id = 1;
  string environment_id = 2;
  string name = 3;
  int64 size_bytes = 4;
}

message DesiredService {
  string allocation_id = 1;
  string service_id = 2;
  string environment_id = 3;
  string name = 4;
  int64 desired_spec_revision = 5;
  platform.v1.ResolvedServiceSpec spec = 6;
  string private_ipv6 = 7;
  string volume_id = 8;
  int64 desired_rollout_generation = 9;
  uint32 network_identity = 10;
  // Runtime-only: the agent merges stored pull credentials here for the
  // runtime. Wire checkpoints and diffs must leave these empty; credentials
  // arrive in PullCredentialSet.
  string registry_username = 11;
  string registry_password = 12;
  string internal_hostname = 13;
  repeated InternalHost internal_hosts = 14;
  platform.v1.RestartObservation restart_observation = 15;
  int64 operator_restart_nonce = 16;
  AllocationIntent intent = 17;
  google.protobuf.Timestamp drain_deadline = 18;
  string private_ipv4 = 19;
  string deployment_id = 20;
}

enum AllocationIntent {
  ALLOCATION_INTENT_UNSPECIFIED = 0;
  ALLOCATION_INTENT_RUN = 1;
  ALLOCATION_INTENT_DRAIN = 2;
}

message InternalHost {
  string hostname = 1;
  string ipv6 = 2;
  string ipv4 = 3;
}

message DesiredNodeState {
  // Checkpoint: full allocation+volume set plus node config for this agent.
  // Services must not carry registry credentials on the wire; credentials
  // arrive in PullCredentialSet. Replica addresses arrive in ReplicaEndpoints.
  string agent_id = 1;
  int64 reconciliation_cursor = 2;
  repeated DesiredVolume volumes = 3;
  repeated DesiredService services = 4;
  google.protobuf.Timestamp generated_at = 5;
  AssignedNodeConfig node_config = 6;
  uint64 authority_epoch = 7;
  SnapshotScope scope = 8;
  bool complete = 9;
  string session_id = 10;
  google.protobuf.Timestamp authority_not_after = 11;
  string cluster_id = 12;
  string node_config_version = 14;
}

// Bounded incremental change from base_revision to target_revision.
// Omission is not removal; only explicit stops remove. Agent-scoped:
// agent_id/cluster must match, and authority fields fence acceptance.
message AllocationDiff {
  string agent_id = 1;
  int64 base_revision = 2;
  int64 target_revision = 3;
  repeated DesiredService starts = 4;
  repeated DesiredService updates = 5;
  repeated string stops = 6;
  repeated DesiredVolume volume_starts = 7;
  repeated string volume_stops = 8;
  google.protobuf.Timestamp generated_at = 9;
  uint64 authority_epoch = 10;
  string session_id = 11;
  google.protobuf.Timestamp authority_not_after = 12;
  string cluster_id = 13;
}

message AllocationCredential {
  string allocation_id = 1;
  string username = 2;
  string password = 3;
}

// Independently versioned pull credentials for this agent's allocations.
// Version is a content hash; empty credentials means none required.
message PullCredentialSet {
  string agent_id = 1;
  string credentials_version = 2;
  repeated AllocationCredential credentials = 3;
  uint64 authority_epoch = 4;
  string session_id = 5;
  google.protobuf.Timestamp authority_not_after = 6;
  string cluster_id = 7;
}

// Independently versioned node config (peers, identities, subnets).
// 2.11/2.12 will split this further; 2.10 provides the versioned seam.
message NodeConfigUpdate {
  string agent_id = 1;
  string node_config_version = 2;
  AssignedNodeConfig node_config = 3;
  uint64 authority_epoch = 4;
  string session_id = 5;
  google.protobuf.Timestamp authority_not_after = 6;
  string cluster_id = 7;
}

// Independently versioned control-plane replica discovery.
message ReplicaEndpoints {
  string agent_id = 1;
  string replicas_version = 2;
  repeated string replica_addresses = 3;
  uint64 authority_epoch = 4;
  string session_id = 5;
  google.protobuf.Timestamp authority_not_after = 6;
  string cluster_id = 7;
}

enum SnapshotScope {
  SNAPSHOT_SCOPE_UNSPECIFIED = 0;
  SNAPSHOT_SCOPE_AGENT = 1;
}

// Sent only after the referenced state and its cursor/versions are durably
// committed. Does not imply runtime success or release of any allocation
// or volume. Carries the cumulative accepted position across all streams.
message DesiredStateAcknowledgement {
  string agent_id = 1;
  string session_id = 2;
  uint64 authority_epoch = 3;
  int64 reconciliation_cursor = 4;
  string node_config_version = 5;
  string credentials_version = 6;
  string replicas_version = 7;
}

message VolumeCondition {
  string volume_id = 1;
  string phase = 2;
  string message = 3;
}

message ServiceCondition {
  string allocation_id = 1;
  string service_id = 2;
  int64 desired_spec_revision = 3;
  int64 applied_spec_revision = 4;
  string phase = 5;
  string message = 6;
  string allocation_ipv4 = 7;
  bool healthy = 8;
  int64 desired_rollout_generation = 9;
  int64 applied_rollout_generation = 10;
  repeated int32 healthy_ipv4_ports = 11;
  platform.v1.RestartObservation restart = 12;
  string allocation_ipv6 = 13;
  repeated int32 healthy_ipv6_ports = 14;
}

message StatusReport {
  string agent_id = 1;
  repeated VolumeCondition volumes = 2;
  repeated ServiceCondition services = 3;
  string session_id = 4;
  uint64 observation_sequence = 5;
  uint64 authority_epoch = 6;
  int64 reconciliation_cursor = 7;
  bool recovery_mode = 8;
}

message LogEntry {
  google.protobuf.Timestamp observed_at = 1;
  string environment_id = 2;
  string service_id = 3;
  string allocation_id = 4;
  string stream = 5;
  int64 rollout_generation = 6;
  uint64 sequence = 7;
  string line = 8;
  platform.v1.ServiceLogType log_type = 9;
  string build_id = 10;
  string stage = 11;
  // Structured attributes for known platform events. Agents never derive
  // these by parsing customer output; customer lines carry no attributes.
  map<string, string> attributes = 12;
  // True when line was truncated to the documented size limit.
  bool truncated = 13;
  // Platform event name for structured events (for example
  // "allocation.crash_loop"). Empty for plain output lines.
  string event = 14;
  // Stable producer-assigned identity for ordering and reconnect
  // deduplication. Retried batches reuse the same IDs.
  string line_id = 15;
}

message LogBatch {
  string agent_id = 1;
  repeated LogEntry entries = 2;
  // Lines dropped by the agent before this batch (rate limiting, spool
  // overflow). The control plane persists these as explicit read gaps.
  uint64 dropped_lines = 3;
  repeated platform.v1.LogDropSummary drops = 4;
}

message AgentClientMessage {
  oneof payload {
    AgentHello hello = 1;
    AgentHeartbeat heartbeat = 2;
    StatusReport status_report = 3;
    LogBatch log_batch = 4;
    DesiredStateAcknowledgement acknowledgement = 5;
  }
}

// Terminates one server batch on the Sync stream. A batch is applied as a
// unit: the agent withholds status publication until this marker, so an
// intermediate inventory is never validated against the batch's final
// assignments. Carries no state and is not acknowledged.
message SyncBatchEnd {
  string session_id = 1;
}

message AgentServerMessage {
  oneof payload {
    DesiredNodeState desired_state = 1;
    AllocationDiff allocation_diff = 2;
    NodeConfigUpdate node_config_update = 3;
    PullCredentialSet pull_credentials = 4;
    ReplicaEndpoints replica_endpoints = 5;
    SyncBatchEnd batch_end = 6;
  }
}

service AgentControl {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc IssueManagedDashboardCertificate(ManagedDashboardCertificateRequest) returns (EnrollResponse);
  rpc Sync(stream AgentClientMessage) returns (stream AgentServerMessage);
}
