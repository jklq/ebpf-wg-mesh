syntax = "proto3";

package platform.v1;

option go_package = "ebof-wg-mesh/api/proto/platformv1;platformv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_USER = 1;
  PROJECT_KIND_MANAGED = 2;
}

enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_QUEUED = 1;
  BUILD_STATE_RUNNING = 2;
  BUILD_STATE_SUCCEEDED = 3;
  BUILD_STATE_FAILED = 4;
  BUILD_STATE_SUPERSEDED = 5;
  BUILD_STATE_CANCELLED = 6;
}

enum SourceAccessState {
  SOURCE_ACCESS_STATE_UNSPECIFIED = 0;
  SOURCE_ACCESS_STATE_AVAILABLE = 1;
  SOURCE_ACCESS_STATE_INSTALLATION_REQUIRED = 2;
  SOURCE_ACCESS_STATE_ACCESS_REVOKED = 3;
  SOURCE_ACCESS_STATE_REPOSITORY_DELETED = 4;
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  ProjectKind kind = 4;
  string system_key = 5;
}

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_PERSISTENT = 1;
}

message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  EnvironmentKind kind = 4;
  bool is_production = 5;
  string copied_from_environment_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message HealthCheck {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_HTTP = 1;
  }

  Type type = 1;
  string path = 2;
  int32 port = 3;
  int32 timeout_seconds = 4;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_ALWAYS = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_NEVER = 3;
}

enum RestartCause {
  RESTART_CAUSE_UNSPECIFIED = 0;
  RESTART_CAUSE_EXIT_ZERO = 1;
  RESTART_CAUSE_EXIT_NONZERO = 2;
  RESTART_CAUSE_SIGNAL = 3;
  RESTART_CAUSE_OOM_KILL = 4;
  RESTART_CAUSE_LIVENESS = 5;
  RESTART_CAUSE_OPERATOR = 6;
  RESTART_CAUSE_NODE_LOSS = 7;
}

// ServiceRestart is the explicit process restart setting for a service.
// Unspecified fields receive platform defaults at canonicalization time.
message ServiceRestart {
  RestartPolicy policy = 1;
  // Maximum number of restarts in the current crash window. Zero means no
  // count bound; the window, if set, is then the only budget.
  int32 max_restarts = 2;
  // Crash window measured from the first restart in the current streak.
  // Zero means no time bound; max_restarts, if set, is then the only budget.
  int32 window_seconds = 3;
  int32 initial_delay_ms = 4;
  int32 max_delay_ms = 5;
  double backoff_multiplier = 6;
  // Fractional jitter applied to the backoff delay, in [0, 1].
  double jitter = 7;
  // Running this long without a crash resets the crash history.
  int32 stable_after_seconds = 8;
}

// RestartObservation is the durable restart view shared by agent and control plane.
message RestartObservation {
  int32 restart_count = 1;
  google.protobuf.Timestamp window_started_at = 2;
  google.protobuf.Timestamp last_restart_at = 3;
  google.protobuf.Timestamp next_restart_at = 4;
  google.protobuf.Timestamp started_at = 5;
  RestartCause last_cause = 6;
  int32 last_exit_code = 7;
  int32 last_signal = 8;
  bool crash_loop = 9;
  int64 applied_rollout_generation = 10;
  int64 applied_operator_restart_nonce = 11;
  string message = 12;
  bool awaiting_restart = 13;
}

message ServiceRuntimePort {
  int32 port = 1;
  bool primary = 2;
}

// ServiceRuntime is the customer-facing process contract. It does not accept
// privileged, host-network, host-PID, sysctl, device, or bind-mount input.
message ServiceRuntime {
  repeated string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  int64 cpu_millis = 4;
  int64 memory_mebibytes = 5;
  repeated ServiceRuntimePort ports = 6;
  HealthCheck health_check = 7;
  string volume_name = 8;
  ServiceRestart restart = 9;
  HealthCheck liveness_check = 10;
  SandboxProfile sandbox_profile = 11;
}

message DirectImageSource {
  string image = 1;
}

message BuildRecipe {
  string dockerfile_path = 1;
  string context_dir = 2;
}

message ServiceSourceSpec {
  string provider = 1;
  string repository_selector = 2;
  string tracked_ref = 3;
  BuildRecipe build_recipe = 4;
}

message ResolvedSourceBinding {
  string id = 1;
  string service_id = 2;
  string provider = 3;
  string repository_selector = 4;
  string tracked_ref = 5;
  string provider_repository_external_id = 6;
  string provider_scope_external_id = 7;
  SourceAccessState access_state = 8;
  google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp fresh_until = 10;
  BuildRecipe build_recipe = 11;
}

message SourceRevision {
  string id = 1;
  string source_binding_id = 2;
  string provider_repository_external_id = 3;
  string tracked_ref = 4;
  string commit_sha = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message SourceSnapshot {
  string id = 1;
  string source_revision_id = 2;
  string provider_repository_external_id = 3;
  string commit_sha = 4;
  string digest = 5;
  bool ready = 6;
  google.protobuf.Timestamp fetched_at = 7;
}

message BuildJobSource {
  string source_revision_id = 1;
  string source_snapshot_id = 2;
  string source_snapshot_digest = 3;
  BuildRecipe build_recipe = 4;
}

message ServiceSource {
  oneof source {
    DirectImageSource image = 1;
    ServiceSourceSpec source_spec = 2;
  }
}

message ServiceSpec {
  ServiceRuntime runtime = 1;
  ServiceSource source = 2;
  optional int32 desired_replica_count = 3;
  RollingStrategy rolling_strategy = 4;
  // A customer may constrain placement to an operator-defined region. Node
  // labels themselves are never accepted through workload APIs.
  string placement_region = 5;
}

// RollingStrategy bounds replacement concurrency and both rollout deadlines.
// Unset fields receive platform defaults during canonicalization. Zero is a
// legal value for max_unavailable and max_surge.
message RollingStrategy {
  optional int32 max_unavailable = 1;
  optional int32 max_surge = 2;
  optional int32 startup_timeout_seconds = 3;
  optional int32 drain_timeout_seconds = 4;
}

message ResolvedServiceSpec {
  string image = 1;
  ServiceRuntime runtime = 2;
}

message SourceStateSummary {
  ServiceSourceSpec desired_spec = 1;
  ResolvedSourceBinding resolved_binding = 2;
  SourceRevision latest_revision = 3;
  SourceSnapshot latest_snapshot = 4;
}

message ServiceSourceSummary {
  oneof source {
    DirectImageSource image = 1;
    SourceStateSummary source_state = 2;
  }
}

enum DeploymentStageState {
  DEPLOYMENT_STAGE_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STAGE_STATE_PENDING = 1;
  DEPLOYMENT_STAGE_STATE_RUNNING = 2;
  DEPLOYMENT_STAGE_STATE_SUCCEEDED = 3;
  DEPLOYMENT_STAGE_STATE_FAILED = 4;
  DEPLOYMENT_STAGE_STATE_SKIPPED = 5;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_STAGED = 1;
  DEPLOYMENT_STATE_QUEUED_BUILD = 2;
  DEPLOYMENT_STATE_BUILDING = 3;
  DEPLOYMENT_STATE_SCHEDULING = 4;
  DEPLOYMENT_STATE_IMAGE_PULL = 5;
  DEPLOYMENT_STATE_STARTING = 6;
  DEPLOYMENT_STATE_READINESS = 7;
  DEPLOYMENT_STATE_ACTIVE = 8;
  DEPLOYMENT_STATE_DRAINING = 9;
  DEPLOYMENT_STATE_COMPLETED = 10;
  DEPLOYMENT_STATE_FAILED = 11;
  DEPLOYMENT_STATE_CANCELLED = 12;
  DEPLOYMENT_STATE_CRASHED = 13;
  DEPLOYMENT_STATE_REMOVED = 14;
  DEPLOYMENT_STATE_SUPERSEDED = 15;
}

enum DeploymentCauseKind {
  DEPLOYMENT_CAUSE_KIND_UNSPECIFIED = 0;
  DEPLOYMENT_CAUSE_KIND_USER = 1;
  DEPLOYMENT_CAUSE_KIND_SYSTEM = 2;
  DEPLOYMENT_CAUSE_KIND_AGENT = 3;
  DEPLOYMENT_CAUSE_KIND_BUILDER = 4;
  DEPLOYMENT_CAUSE_KIND_WEBHOOK = 5;
}

enum DeploymentAction {
  DEPLOYMENT_ACTION_UNSPECIFIED = 0;
  DEPLOYMENT_ACTION_RESTART = 1;
  DEPLOYMENT_ACTION_EXACT_REDEPLOY = 2;
  DEPLOYMENT_ACTION_ROLLBACK = 3;
  DEPLOYMENT_ACTION_CANCEL = 4;
  DEPLOYMENT_ACTION_REMOVE = 5;
  DEPLOYMENT_ACTION_RETRY = 6;
}

message DeploymentActionRecord {
  string id = 1;
  DeploymentAction action = 2;
  string target_deployment_id = 3;
  string result_deployment_id = 4;
  string allocation_id = 5;
  string requested_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message DeploymentStatus {
  string deployment_id = 1;
  DeploymentState state = 2;
  google.protobuf.Timestamp transitioned_at = 3;
  DeploymentCauseKind cause_kind = 4;
  string cause_id = 5;
  string reason_code = 6;
  string detail = 7;
  int64 spec_revision = 8;
  string image_digest = 9;
  int64 rollout_generation = 10;
}

message DeploymentStage {
  string key = 1;
  string label = 2;
  string detail = 3;
  DeploymentStageState state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message BuildStatus {
  string build_id = 1;
  BuildState state = 2;
  string commit_sha = 3;
  string image_digest = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string failure_reason = 8;
  string commit_message = 9;
  string commit_author = 10;
  repeated DeploymentStage stages = 11;
}

enum ServiceUnappliedChangeAction {
  SERVICE_UNAPPLIED_CHANGE_ACTION_UNSPECIFIED = 0;
  SERVICE_UNAPPLIED_CHANGE_ACTION_ADD = 1;
  SERVICE_UNAPPLIED_CHANGE_ACTION_UPDATE = 2;
  SERVICE_UNAPPLIED_CHANGE_ACTION_REMOVE = 3;
}

message ServiceUnappliedChange {
  string id = 1;
  string section = 2;
  string field = 3;
  string path = 4;
  ServiceUnappliedChangeAction action = 5;
  string current_value = 6;
  string new_value = 7;
}

message Service {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  ServiceSpec spec = 4;
  int64 spec_revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int64 rollout_generation = 8;
  ServiceSourceSummary source_summary = 9;
  string last_successful_commit_sha = 10;
  string resolved_image = 11;
  BuildStatus latest_build = 12;
  bool pending_changes = 13;
  int32 unapplied_change_count = 14;
  repeated ServiceUnappliedChange unapplied_changes = 15;
  string internal_hostname = 16;
  DeploymentStatus latest_deployment = 17;
  int32 desired_replica_count = 18;
  int32 ready_replica_count = 19;
  string placement_message = 20;
  repeated SandboxProfileAuditEvent sandbox_profile_audit = 21;
}

enum DomainOwnershipState {
  DOMAIN_OWNERSHIP_STATE_UNSPECIFIED = 0;
  DOMAIN_OWNERSHIP_STATE_VERIFIED = 1;
  DOMAIN_OWNERSHIP_STATE_UNVERIFIED = 2;
}

message DomainBinding {
  string hostname = 1;
  string service_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 target_port = 5;
  bool platform_generated = 6;
  DomainOwnershipState ownership_state = 7;
  string ownership_message = 8;
}

message Volume {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
}

enum AgentLifecycleState {
  AGENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_STATE_ENROLLING = 1;
  AGENT_LIFECYCLE_STATE_ACTIVE = 2;
  AGENT_LIFECYCLE_STATE_CORDONED = 3;
  AGENT_LIFECYCLE_STATE_DRAINING = 4;
  AGENT_LIFECYCLE_STATE_UNAVAILABLE = 5;
  AGENT_LIFECYCLE_STATE_RETIRED = 6;
}

message Agent {
  string id = 1;
  string name = 2;
  string advertise_addr = 3;
  bool healthy = 4;
  int64 cpu_millis_capacity = 5;
  int64 memory_mebibytes_capacity = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  AgentLifecycleState lifecycle_state = 8;
  string region = 9;
  string zone = 10;
  string failure_domain = 11;
  int64 reserved_cpu_millis = 12;
  int64 reserved_memory_mebibytes = 13;
  int64 schedulable_cpu_millis = 14;
  int64 schedulable_memory_mebibytes = 15;
  int64 allocated_cpu_millis = 16;
  int64 allocated_memory_mebibytes = 17;
  int64 headroom_cpu_millis = 18;
  int64 headroom_memory_mebibytes = 19;
  repeated string runtime_capabilities = 20;
  string software_version = 21;
  string version_skew_warning = 22;
  int32 allocation_count = 23;
  string maintenance_message = 24;
  google.protobuf.Timestamp credential_revoked_at = 25;
}

message AllocationStatus {
  string allocation_id = 1;
  string service_id = 2;
  string agent_id = 3;
  int64 desired_spec_revision = 4;
  int64 applied_spec_revision = 5;
  string phase = 6;
  string message = 7;
  string allocation_ip = 8;
  bool healthy = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 desired_rollout_generation = 11;
  int64 applied_rollout_generation = 12;
  repeated int32 healthy_ports = 13;
  RestartObservation restart = 14;
  int64 operator_restart_nonce = 15;
  string rollout_state = 16;
  google.protobuf.Timestamp drain_started_at = 17;
  google.protobuf.Timestamp drain_deadline = 18;
}

message ServiceStatus {
  Service service = 1;
  AllocationStatus allocation = 2;
  int64 index = 3;
  bool not_modified = 4;
  repeated AllocationStatus allocations = 5;
}

message CreateProjectRequest {
  string name = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message ListEnvironmentsRequest {
  string project_id = 1;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message GetEnvironmentRequest {
  string environment_id = 1;
}

message CreateEnvironmentRequest {
  string project_id = 1;
  string name = 2;
}

message DuplicateEnvironmentRequest {
  string source_environment_id = 1;
  string name = 2;
  bool copy_variables = 3;
}

message RenameEnvironmentRequest {
  string environment_id = 1;
  string name = 2;
}

message DeleteEnvironmentRequest {
  string environment_id = 1;
}

message DeployEnvironmentRequest {
  string environment_id = 1;
}

message DeployEnvironmentResponse {
  repeated ServiceStatus services = 1;
}

message InspectSourceRequest {
  string provider = 1;
  string repository_selector = 2;
  string project_id = 3;
  // Transient GitHub OAuth token used by the control plane to verify that the
  // delegated user can read the selected repository. Never persisted.
  string github_user_access_token = 4 [debug_redact = true];
}

message InspectSourceResponse {
  SourceAccessState access_state = 1;
  string default_branch = 2;
  repeated string dockerfile_candidates = 3;
  BuildRecipe recommended_build_recipe = 4;
  repeated int32 recommended_ports = 5;
}

message CreateServiceRequest {
  string environment_id = 1;
  ServiceInput service = 2;
}

message UpdateServiceRequest {
  string service_id = 1;
  ServiceUpdate service = 2;
}

message ScaleServiceRequest {
  string service_id = 1;
  int32 desired_replica_count = 2;
}

message RestartServiceRequest {
  string service_id = 1;
}

message ApplyDeploymentActionRequest {
  string service_id = 1;
  string deployment_id = 2;
  DeploymentAction action = 3;
  string idempotency_key = 4;
  // Empty restarts every allocation. Only valid for RESTART.
  string allocation_id = 5;
}

message DiscardServiceChangesRequest {
  string service_id = 1;
  repeated string change_ids = 2;
  bool discard_all = 3;
}

message DeleteServiceRequest {
  string service_id = 1;
}

message GetServiceRequest {
  string service_id = 1;
}

message ListServicesRequest {
  string environment_id = 1;
  int64 wait_index = 2;
  int32 wait_timeout_seconds = 3;
}

message ListServicesResponse {
  repeated Service services = 1;
  int64 index = 2;
  bool not_modified = 3;
}

message CreateVolumeRequest {
  string environment_id = 1;
  string name = 2;
  int64 size_bytes = 3;
}

message DeleteVolumeRequest {
  string volume_id = 1;
}

message ListVolumesRequest {
  string environment_id = 1;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message ServiceInput {
  string name = 1;
  ServiceSpec spec = 2;
}

message ServiceUpdate {
  ServiceSpec spec = 1;
  string name = 2;
}

message DomainBindingInput {
  string hostname = 1;
  string service_id = 2;
  int32 target_port = 3;
}

message DomainBindingTarget {
  string service_id = 1;
  int32 target_port = 2;
}

message GenerateDomainBindingRequest {
  string service_id = 1;
  int32 target_port = 2;
}

message CreateDomainBindingRequest {
  DomainBindingInput binding = 1;
}

message GetDomainBindingRequest {
  string hostname = 1;
}

message ListDomainBindingsRequest {
  string service_id = 1;
}

message ListDomainBindingsResponse {
  repeated DomainBinding bindings = 1;
}

message UpdateDomainBindingRequest {
  string hostname = 1;
  DomainBindingTarget binding = 2;
}

message DeleteDomainBindingRequest {
  string hostname = 1;
}

message GetServiceStatusRequest {
  string service_id = 1;
  int64 wait_index = 2;
  int32 wait_timeout_seconds = 3;
}

enum ServiceLogType {
  SERVICE_LOG_TYPE_UNSPECIFIED = 0;
  SERVICE_LOG_TYPE_RUNTIME = 1;
  SERVICE_LOG_TYPE_BUILD = 2;
  SERVICE_LOG_TYPE_DEPLOY = 3;
  SERVICE_LOG_TYPE_HTTP = 4;
  SERVICE_LOG_TYPE_NETWORK = 5;
}

message ListServiceLogsRequest {
  string service_id = 1;
  string allocation_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 limit = 5;
  ServiceLogType log_type = 6;
  string build_id = 7;
  string search = 8;
}

message ServiceLogLine {
  google.protobuf.Timestamp observed_at = 1;
  string environment_id = 2;
  string service_id = 3;
  string allocation_id = 4;
  string agent_id = 5;
  string stream = 6;
  int64 rollout_generation = 7;
  uint64 sequence = 8;
  string line = 9;
  ServiceLogType log_type = 10;
  string build_id = 11;
  string stage = 12;
}

message ListServiceLogsResponse {
  repeated ServiceLogLine lines = 1;
}

message ListServiceDeploymentsRequest {
  string service_id = 1;
  int32 limit = 2;
}

message DeploymentRecord {
  string id = 1;
  string service_id = 2;
  int64 rollout_generation = 3;
  int64 spec_revision = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6;
  BuildStatus build = 7;
  bool is_current = 8;
  string requested_by_user_id = 9;
  DeploymentStatus status = 10;
  repeated DeploymentStage stages = 11;
  string image_digest = 12;
  repeated DeploymentActionRecord actions = 13;
  map<string, int64> variable_versions = 14;
}

message ListServiceDeploymentsResponse {
  repeated DeploymentRecord deployments = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message CreateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string region = 3;
  string zone = 4;
  string failure_domain = 5;
  int64 reserved_cpu_millis = 6;
  int64 reserved_memory_mebibytes = 7;
}

message AgentEnrollment {
  Agent agent = 1;
  // Returned only when a new enrollment is created. Store it as a secret.
  string bootstrap_token = 2 [debug_redact = true];
}

message UpdateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string region = 3;
  string zone = 4;
  string failure_domain = 5;
  int64 reserved_cpu_millis = 6;
  int64 reserved_memory_mebibytes = 7;
}

message SetAgentLifecycleRequest {
  string agent_id = 1;
  AgentLifecycleState lifecycle_state = 2;
}

message FleetCapacity {
  int32 node_count = 1;
  int32 schedulable_node_count = 2;
  int64 schedulable_cpu_millis = 3;
  int64 schedulable_memory_mebibytes = 4;
  int64 allocated_cpu_millis = 5;
  int64 allocated_memory_mebibytes = 6;
  int64 headroom_cpu_millis = 7;
  int64 headroom_memory_mebibytes = 8;
}

message Fleet {
  repeated Agent agents = 1;
  FleetCapacity capacity = 2;
  string version_warning = 3;
}

message ClaimBuildRequest {
  string builder_id = 1;
  string builder_name = 2;
}

message BuildJob {
  string build_id = 1;
  string service_id = 2;
  string project_id = 3;
  string service_name = 4;
  string commit_sha = 5;
  BuildJobSource source = 6;
  // The exact build-specific repository and tag assigned by the control plane.
  string registry_push_reference = 7;
  // Short-lived credentials whose registry-side ACL permits pull/push only on
  // registry_push_reference's repository. These are never shared platform
  // registry credentials.
  string registry_username = 8;
  string registry_password = 9;
  string environment_id = 10;
}

message DownloadSourceSnapshotRequest {
  string snapshot_id = 1;
}

message SourceSnapshotChunk {
  string snapshot_id = 1;
  string digest = 2;
  int64 total_size = 3;
  int64 offset = 4;
  bytes data = 5;
}

message BuilderHeartbeatRequest {
  string builder_id = 1;
  string build_id = 2;
}

message ReportBuildLogsRequest {
  string builder_id = 1;
  string build_id = 2;
  repeated BuildLogLine lines = 3;
}

message BuildLogLine {
  google.protobuf.Timestamp observed_at = 1;
  string stream = 2;
  uint64 sequence = 3;
  string line = 4;
}

message CompleteBuildRequest {
  string builder_id = 1;
  string build_id = 2;
  BuildState state = 3;
  string commit_sha = 4;
  string image_digest = 5;
  string failure_reason = 6;
}

message IngestGitHubWebhookRequest {
  string delivery_id = 1;
  string event_type = 2;
  string signature_256 = 3;
  bytes payload = 4;
}

message LinkGitHubRepositoryRequest {
  string project_id = 1;
  string repository_selector = 2;
  // Transient GitHub OAuth token used by the control plane to verify that the
  // delegated user can read the selected repository. Never persisted.
  string github_user_access_token = 3 [debug_redact = true];
}

// SandboxRelaxation is the intentionally small set of compatibility concessions
// an operator may attach to a named workload sandbox profile. Security-critical
// namespace, device, seccomp, sysctl, capability, and cgroup controls are not
// relaxable through the workload API.
enum SandboxRelaxation {
  SANDBOX_RELAXATION_UNSPECIFIED = 0;
  SANDBOX_RELAXATION_RUN_AS_ROOT = 1;
  SANDBOX_RELAXATION_WRITABLE_ROOT_FILESYSTEM = 2;
}

// SandboxProfile is the control-plane-resolved isolation policy persisted with
// each service revision. Clients select by name; the control plane replaces the
// remaining fields from operator configuration before storing desired state.
message SandboxProfile {
  string name = 1;
  string risk = 2;
  repeated SandboxRelaxation relaxations = 3;
}

message SandboxProfileAuditEvent {
  string actor_user_id = 1;
  string action = 2;
  string previous_profile_name = 3;
  SandboxProfile profile = 4;
  int64 spec_revision = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListSandboxProfilesResponse {
  repeated SandboxProfile profiles = 1;
}

service PlatformService {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (Environment);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (Environment);
  rpc DuplicateEnvironment(DuplicateEnvironmentRequest) returns (Environment);
  rpc RenameEnvironment(RenameEnvironmentRequest) returns (Environment);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (google.protobuf.Empty);
