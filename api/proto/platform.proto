syntax = "proto3";

package platform.v1;

option go_package = "ebof-wg-mesh/api/proto/platformv1;platformv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_USER = 1;
  PROJECT_KIND_MANAGED = 2;
}

enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_QUEUED = 1;
  BUILD_STATE_RUNNING = 2;
  BUILD_STATE_SUCCEEDED = 3;
  BUILD_STATE_FAILED = 4;
  BUILD_STATE_SUPERSEDED = 5;
  BUILD_STATE_CANCELLED = 6;
}

enum SourceAccessState {
  SOURCE_ACCESS_STATE_UNSPECIFIED = 0;
  SOURCE_ACCESS_STATE_AVAILABLE = 1;
  SOURCE_ACCESS_STATE_INSTALLATION_REQUIRED = 2;
  SOURCE_ACCESS_STATE_ACCESS_REVOKED = 3;
  SOURCE_ACCESS_STATE_REPOSITORY_DELETED = 4;
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  ProjectKind kind = 4;
  string system_key = 5;
  DeletionState deletion = 6;
  // Log retention in days. Zero means the platform default.
  int32 log_retention_days = 7;
  // The workspace that owns a user project. Empty for managed projects.
  string workspace_id = 8;
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  // Manages the workspace, its members, and invitations, and edits projects.
  WORKSPACE_ROLE_ADMIN = 1;
  // Creates and edits projects.
  WORKSPACE_ROLE_MEMBER = 2;
  // Reads projects.
  WORKSPACE_ROLE_VIEWER = 3;
}

// Workspace groups projects and the people who can access them. Every user
// has exactly one personal workspace, which cannot be deleted or left.
message Workspace {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  bool personal = 4;
  // The calling user's role in the workspace.
  WorkspaceRole role = 5;
}

message WorkspaceMember {
  string user_id = 1;
  WorkspaceRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

// WorkspaceInvitation offers membership to whoever signs in with email.
message WorkspaceInvitation {
  string id = 1;
  string workspace_id = 2;
  string workspace_name = 3;
  string email = 4;
  WorkspaceRole role = 5;
  string invited_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

// DeletionState marks a tombstoned resource. It is absent while the resource
// is live. Delete operations tombstone instead of destroying: the row keeps
// serving reads, new work is refused, ingress and allocations are withdrawn,
// and background garbage collection destroys the row after delete_expires_at.
// When inherited is true the tombstone belongs to an ancestor
// (project/environment/service) and the timestamps identify that tombstone.
message DeletionState {
  google.protobuf.Timestamp deleted_at = 1;
  string deleted_by_user_id = 2;
  google.protobuf.Timestamp delete_expires_at = 3;
  bool inherited = 4;
}

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_PERSISTENT = 1;
}

message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  EnvironmentKind kind = 4;
  bool is_production = 5;
  string copied_from_environment_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool auto_deploy = 9;
  DeletionState deletion = 10;
}

message HealthCheck {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_HTTP = 1;
  }

  Type type = 1;
  string path = 2;
  int32 port = 3;
  int32 timeout_seconds = 4;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_ALWAYS = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_NEVER = 3;
}

enum RestartCause {
  RESTART_CAUSE_UNSPECIFIED = 0;
  RESTART_CAUSE_EXIT_ZERO = 1;
  RESTART_CAUSE_EXIT_NONZERO = 2;
  RESTART_CAUSE_SIGNAL = 3;
  RESTART_CAUSE_OOM_KILL = 4;
  RESTART_CAUSE_LIVENESS = 5;
  RESTART_CAUSE_OPERATOR = 6;
  RESTART_CAUSE_NODE_LOSS = 7;
  RESTART_CAUSE_DISK_EXHAUSTED = 8;
}

message ServiceRestart {
  RestartPolicy policy = 1;
  int32 max_restarts = 2;
  int32 window_seconds = 3;
  int32 initial_delay_ms = 4;
  int32 max_delay_ms = 5;
  double backoff_multiplier = 6;
  double jitter = 7;
  int32 stable_after_seconds = 8;
}

message RestartObservation {
  int32 restart_count = 1;
  google.protobuf.Timestamp window_started_at = 2;
  google.protobuf.Timestamp last_restart_at = 3;
  google.protobuf.Timestamp next_restart_at = 4;
  google.protobuf.Timestamp started_at = 5;
  RestartCause last_cause = 6;
  int32 last_exit_code = 7;
  int32 last_signal = 8;
  bool crash_loop = 9;
  int64 applied_rollout_generation = 10;
  int64 applied_operator_restart_nonce = 11;
  string message = 12;
  bool awaiting_restart = 13;
}

message ServiceRuntimePort {
  int32 port = 1;
  bool primary = 2;
}

// ServiceRuntime is the customer-facing process contract. It does not accept
// privileged, host-network, host-PID, sysctl, device, or bind-mount input.
message ServiceRuntime {
  repeated string command = 1;
  repeated string args = 2;
  // Env values may hold credentials: encrypted at rest and redacted from
  // debug output. Reads return names with empty values unless the caller
  // explicitly reveals secrets (see GetServiceRequest.include_secrets).
  map<string, string> env = 3 [debug_redact = true];
  int64 cpu_millis = 4;
  int64 memory_mebibytes = 5;
  repeated ServiceRuntimePort ports = 6;
  HealthCheck health_check = 7;
  reserved 8;
  reserved "volume_name";
  ServiceRestart restart = 9;
  HealthCheck liveness_check = 10;
  reserved 11;
  reserved "sandbox_profile";
  // At most one volume per service. Attaching, detaching, or moving the mount
  // is a staged change like any other runtime field.
  ServiceVolumeMount volume = 12;
}

// ServiceVolumeMount attaches one environment volume at an absolute path
// inside the container. Root and system paths are rejected.
message ServiceVolumeMount {
  string volume_name = 1;
  string mount_path = 2;
}

message DirectImageSource {
  string image = 1;
}

enum BuilderKind {
  BUILDER_KIND_UNSPECIFIED = 0;
  BUILDER_KIND_RAILPACK = 1;
  BUILDER_KIND_DOCKERFILE = 2;
}

message BuildRecipe {
  string dockerfile_path = 1;
  string context_dir = 2;
  BuilderKind builder = 3;
}

message ServiceSourceSpec {
  string provider = 1;
  string repository_selector = 2;
  string tracked_ref = 3;
  BuildRecipe build_recipe = 4;
}

message ResolvedSourceBinding {
  string id = 1;
  string service_id = 2;
  string provider = 3;
  string repository_selector = 4;
  string tracked_ref = 5;
  string provider_repository_external_id = 6;
  string provider_scope_external_id = 7;
  SourceAccessState access_state = 8;
  google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp fresh_until = 10;
  BuildRecipe build_recipe = 11;
}

message SourceRevision {
  string id = 1;
  string source_binding_id = 2;
  string provider_repository_external_id = 3;
  string tracked_ref = 4;
  string commit_sha = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message SourceSnapshot {
  string id = 1;
  string source_revision_id = 2;
  string provider_repository_external_id = 3;
  string commit_sha = 4;
  string digest = 5;
  bool ready = 6;
  google.protobuf.Timestamp fetched_at = 7;
}

message BuildJobSource {
  string source_revision_id = 1;
  string source_snapshot_id = 2;
  string source_snapshot_digest = 3;
  BuildRecipe build_recipe = 4;
}

message ServiceSource {
  oneof source {
    DirectImageSource image = 1;
    ServiceSourceSpec source_spec = 2;
  }
}

message ServiceSpec {
  ServiceRuntime runtime = 1;
  ServiceSource source = 2;
  optional int32 desired_replica_count = 3;
  RollingStrategy rolling_strategy = 4;
  // A customer may constrain placement to an operator-defined region. Node
  // labels themselves are never accepted through workload APIs.
  string placement_region = 5;
  // Serverless services scale to zero after an idle period with no network
  // activity and start again on the next public or private request. Absent
  // means disabled. Like every spec field it takes effect on the next
  // deployment. See docs/serverless.md.
  optional bool serverless_enabled = 6;
}

message RollingStrategy {
  optional int32 healthcheck_timeout_seconds = 1;
  optional int32 draining_seconds = 2;
}

message ResolvedServiceSpec {
  string image = 1;
  ServiceRuntime runtime = 2;
}

message SourceStateSummary {
  ServiceSourceSpec desired_spec = 1;
  ResolvedSourceBinding resolved_binding = 2;
  SourceRevision latest_revision = 3;
  SourceSnapshot latest_snapshot = 4;
}

message ServiceSourceSummary {
  oneof source {
    DirectImageSource image = 1;
    SourceStateSummary source_state = 2;
  }
}

enum DeploymentStageState {
  DEPLOYMENT_STAGE_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STAGE_STATE_PENDING = 1;
  DEPLOYMENT_STAGE_STATE_RUNNING = 2;
  DEPLOYMENT_STAGE_STATE_SUCCEEDED = 3;
  DEPLOYMENT_STAGE_STATE_FAILED = 4;
  DEPLOYMENT_STAGE_STATE_SKIPPED = 5;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_STAGED = 1;
  DEPLOYMENT_STATE_QUEUED_BUILD = 2;
  DEPLOYMENT_STATE_BUILDING = 3;
  DEPLOYMENT_STATE_SCHEDULING = 4;
  DEPLOYMENT_STATE_IMAGE_PULL = 5;
  DEPLOYMENT_STATE_STARTING = 6;
  DEPLOYMENT_STATE_READINESS = 7;
  DEPLOYMENT_STATE_ACTIVE = 8;
  DEPLOYMENT_STATE_DRAINING = 9;
  DEPLOYMENT_STATE_COMPLETED = 10;
  DEPLOYMENT_STATE_FAILED = 11;
  DEPLOYMENT_STATE_CANCELLED = 12;
  DEPLOYMENT_STATE_CRASHED = 13;
  DEPLOYMENT_STATE_REMOVED = 14;
  DEPLOYMENT_STATE_SUPERSEDED = 15;
}

enum DeploymentCauseKind {
  DEPLOYMENT_CAUSE_KIND_UNSPECIFIED = 0;
  DEPLOYMENT_CAUSE_KIND_USER = 1;
  DEPLOYMENT_CAUSE_KIND_SYSTEM = 2;
  DEPLOYMENT_CAUSE_KIND_AGENT = 3;
  DEPLOYMENT_CAUSE_KIND_BUILDER = 4;
  DEPLOYMENT_CAUSE_KIND_WEBHOOK = 5;
}

enum DeploymentAction {
  DEPLOYMENT_ACTION_UNSPECIFIED = 0;
  DEPLOYMENT_ACTION_RESTART = 1;
  DEPLOYMENT_ACTION_EXACT_REDEPLOY = 2;
  DEPLOYMENT_ACTION_ROLLBACK = 3;
  DEPLOYMENT_ACTION_CANCEL = 4;
  DEPLOYMENT_ACTION_REMOVE = 5;
  DEPLOYMENT_ACTION_RETRY = 6;
}

message DeploymentActionRecord {
  string id = 1;
  DeploymentAction action = 2;
  string target_deployment_id = 3;
  string result_deployment_id = 4;
  string allocation_id = 5;
  string requested_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message DeploymentStatus {
  string deployment_id = 1;
  DeploymentState state = 2;
  google.protobuf.Timestamp transitioned_at = 3;
  DeploymentCauseKind cause_kind = 4;
  string cause_id = 5;
  string reason_code = 6;
  string detail = 7;
  int64 spec_revision = 8;
  string image_digest = 9;
  int64 rollout_generation = 10;
  // True when the deployment reused an image built for an earlier deployment
  // of the same commit instead of running a build (reason BUILD_REUSED).
  // reason_code only carries that reason until the rollout moves on.
  bool build_reused = 11;
}

message DeploymentStage {
  string key = 1;
  string label = 2;
  string detail = 3;
  DeploymentStageState state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message CommitContributor {
  string name = 1;
  // Empty when the person is not tied to a GitHub account.
  string login = 2;
  string avatar_url = 3;
}

message BuildStatus {
  string build_id = 1;
  BuildState state = 2;
  string commit_sha = 3;
  string image_digest = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string failure_reason = 8;
  string commit_message = 9;
  // Author first, then Co-authored-by trailers.
  repeated CommitContributor commit_contributors = 10;
  repeated DeploymentStage stages = 11;
  BuilderKind builder = 12;
  // Lease-based scheduler fields (2.5). attempt_count counts every claim
  // including takeovers; attempt_limit bounds retries of transient worker
  // loss. cancel_requested_at marks cooperative cancellation of a running
  // build: the builder was asked to stop but has not finished yet.
  int64 attempt_count = 13;
  int64 attempt_limit = 14;
  string builder_id = 15;
  google.protobuf.Timestamp lease_expires_at = 16;
  google.protobuf.Timestamp cancel_requested_at = 17;
  // Immutable runtime identity of the built image (2.6); absent until the
  // build succeeds.
  BuildArtifact artifact = 18;
}

// BuildArtifact is the immutable deploy-by-digest record: the source of
// runtime identity for a deployment. Rows are insert-only; a mutable tag
// appears only as source_image_ref (user input) and never runs.
message BuildArtifact {
  string id = 1;
  string service_id = 2;
  // Build that produced this artifact; absent for direct_image artifacts.
  string build_id = 3;
  // "build" or "direct_image".
  string kind = 4;
  string source_snapshot_digest = 5;
  string commit_sha = 6;
  BuildRecipe build_recipe = 7;
  string builder_version = 8;
  string image_repository = 9;
  string image_manifest_digest = 10;
  // Digest-pinned runtime reference (repository@manifest digest). This is
  // what runs.
  string image_ref = 11;
  // The user's original image input when it was not digest-pinned
  // (direct_image artifacts).
  string source_image_ref = 12;
  string build_actor_kind = 13;
  string build_actor_id = 14;
  google.protobuf.Timestamp created_at = 15;
}

message ListServiceArtifactsRequest {
  string service_id = 1;
  int32 limit = 2;
}

message ListServiceArtifactsResponse {
  repeated BuildArtifact artifacts = 1;
}

message BuildAttempt {
  int64 attempt_number = 1;
  string builder_id = 2;
  int64 owner_epoch = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  // leased, succeeded, failed_terminal, worker_lost, cancelled, timed_out,
  // superseded.
  string outcome = 6;
  string detail = 7;
}

message ListBuildAttemptsRequest {
  string service_id = 1;
  string build_id = 2;
}

message ListBuildAttemptsResponse {
  repeated BuildAttempt attempts = 1;
}

enum ServiceUnappliedChangeAction {
  SERVICE_UNAPPLIED_CHANGE_ACTION_UNSPECIFIED = 0;
  SERVICE_UNAPPLIED_CHANGE_ACTION_ADD = 1;
  SERVICE_UNAPPLIED_CHANGE_ACTION_UPDATE = 2;
  SERVICE_UNAPPLIED_CHANGE_ACTION_REMOVE = 3;
}

message ServiceUnappliedChange {
  string id = 1;
  string section = 2;
  string field = 3;
  string path = 4;
  ServiceUnappliedChangeAction action = 5;
  string current_value = 6;
  string new_value = 7;
}

// ServerlessState is the sleep state of a serverless service. It is only
// meaningful when the service's spec enables serverless; other services
// always report SERVERLESS_STATE_AWAKE. Asleep is a healthy state: the
// deployment stays active and desired state is preserved.
enum ServerlessState {
  SERVERLESS_STATE_UNSPECIFIED = 0;
  SERVERLESS_STATE_AWAKE = 1;
  SERVERLESS_STATE_ASLEEP = 2;
  SERVERLESS_STATE_WAKING = 3;
}

message Service {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  ServiceSpec spec = 4;
  int64 spec_revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int64 rollout_generation = 8;
  ServiceSourceSummary source_summary = 9;
  string last_successful_commit_sha = 10;
  string resolved_image = 11;
  BuildStatus latest_build = 12;
  bool pending_changes = 13;
  int32 unapplied_change_count = 14;
  repeated ServiceUnappliedChange unapplied_changes = 15;
  string internal_hostname = 16;
  DeploymentStatus latest_deployment = 17;
  int32 desired_replica_count = 18;
  int32 ready_replica_count = 19;
  string placement_message = 20;
  reserved 21;
  reserved "sandbox_profile_audit";
  DeletionState deletion = 22;
  ServerlessState serverless_state = 23;
}

enum DomainOwnershipState {
  DOMAIN_OWNERSHIP_STATE_UNSPECIFIED = 0;
  DOMAIN_OWNERSHIP_STATE_VERIFIED = 1;
  DOMAIN_OWNERSHIP_STATE_UNVERIFIED = 2;
}

// DomainCertificateState is the HTTPS state of one public hostname.
enum DomainCertificateState {
  // The platform does not manage HTTPS for the hostname; it serves plain HTTP.
  DOMAIN_CERTIFICATE_STATE_UNSPECIFIED = 0;
  // The certificate is not issued yet, for example while DNS is not ready.
  DOMAIN_CERTIFICATE_STATE_PENDING = 1;
  // The ingress serves HTTPS and redirects HTTP to HTTPS.
  DOMAIN_CERTIFICATE_STATE_ACTIVE = 2;
  // Issuance failed; the platform retries at retry_at.
  DOMAIN_CERTIFICATE_STATE_FAILED = 3;
}

message DomainCertificate {
  DomainCertificateState state = 1;
  string message = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp retry_at = 4;
}

message DomainBinding {
  string hostname = 1;
  string service_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 target_port = 5;
  bool platform_generated = 6;
  DomainOwnershipState ownership_state = 7;
  string ownership_message = 8;
  DeletionState deletion = 9;
  DomainCertificate certificate = 10;
}

enum VolumeState {
  VOLUME_STATE_UNSPECIFIED = 0;
  // Not yet on a node: the volume is created where its service first deploys,
  // or its node has not reported it yet.
  VOLUME_STATE_PENDING = 1;
  VOLUME_STATE_READY = 2;
  // The workload sees ENOSPC; grow the volume to recover.
  VOLUME_STATE_FULL = 3;
  // The pinned node is lost, retired, or unreachable. The volume's service
  // does not start elsewhere with an empty volume.
  VOLUME_STATE_UNAVAILABLE = 4;
  VOLUME_STATE_ERROR = 5;
}

// Volume is a directory on one node that survives redeploys, restarts, and
// agent upgrades. It is not replicated and not backed up.
message Volume {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  // Provisioned size. Grows, never shrinks.
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  DeletionState deletion = 6;
  // Node the volume is pinned to; empty until its service first deploys.
  string agent_id = 7;
  string agent_name = 8;
  VolumeState state = 9;
  string state_message = 10;
  // Bytes in use as last reported by the pinned node.
  int64 used_bytes = 11;
  google.protobuf.Timestamp observed_at = 12;
  // Created since the last environment release. Releasing commits it;
  // discarding the drafts that mount it removes it.
  bool staged = 13;
}

enum AgentLifecycleState {
  AGENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_STATE_ENROLLING = 1;
  AGENT_LIFECYCLE_STATE_ACTIVE = 2;
  AGENT_LIFECYCLE_STATE_CORDONED = 3;
  AGENT_LIFECYCLE_STATE_DRAINING = 4;
  AGENT_LIFECYCLE_STATE_UNAVAILABLE = 5;
  AGENT_LIFECYCLE_STATE_RETIRED = 6;
}

message Agent {
  string id = 1;
  string name = 2;
  string advertise_addr = 3;
  bool healthy = 4;
  int64 cpu_millis_capacity = 5;
  int64 memory_mebibytes_capacity = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  AgentLifecycleState lifecycle_state = 8;
  string region = 9;
  string zone = 10;
  string failure_domain = 11;
  int64 reserved_cpu_millis = 12;
  int64 reserved_memory_mebibytes = 13;
  int64 schedulable_cpu_millis = 14;
  int64 schedulable_memory_mebibytes = 15;
  int64 allocated_cpu_millis = 16;
  int64 allocated_memory_mebibytes = 17;
  int64 headroom_cpu_millis = 18;
  int64 headroom_memory_mebibytes = 19;
  repeated string runtime_capabilities = 20;
  string software_version = 21;
  string version_skew_warning = 22;
  int32 allocation_count = 23;
  string maintenance_message = 24;
  google.protobuf.Timestamp credential_revoked_at = 25;
  string wireguard_endpoint = 26;
  // Volume data the agent retains on disk with no desired entry. Agents never
  // delete these on their own; an operator decides.
  repeated string orphaned_volume_ids = 27;
  // Stable hosts run applications. Intermittent hosts may power off and run builds only.
  string host_type = 28;
}

message AllocationStatus {
  string allocation_id = 1;
  string service_id = 2;
  string agent_id = 3;
  int64 desired_spec_revision = 4;
  int64 applied_spec_revision = 5;
  string phase = 6;
  string message = 7;
  string allocation_ipv4 = 8;
  bool healthy = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 desired_rollout_generation = 11;
  int64 applied_rollout_generation = 12;
  repeated int32 healthy_ipv4_ports = 13;
  RestartObservation restart = 14;
  int64 operator_restart_nonce = 15;
  string rollout_state = 16;
  google.protobuf.Timestamp drain_started_at = 17;
  google.protobuf.Timestamp drain_deadline = 18;
  string allocation_ipv6 = 19;
  repeated int32 healthy_ipv6_ports = 20;
}

message LiveReadMeta {
  int64 accepted_durable_position = 1;
  uint64 applied_live_position = 2;
  google.protobuf.Timestamp observation_freshness = 3;
  bool live_owner_ready = 4;
}

message ServiceStatus {
  Service service = 1;
  AllocationStatus allocation = 2;
  int64 index = 3;
  bool not_modified = 4;
  repeated AllocationStatus allocations = 5;
  LiveReadMeta live = 6;
}

message CreateProjectRequest {
  string name = 1;
  // Empty creates the project in the caller's personal workspace.
  string workspace_id = 2;
}

message ListProjectsRequest {
  bool include_deleted = 1;
  // Empty lists projects across every workspace the caller belongs to.
  string workspace_id = 2;
  // Include lightweight environment and service summaries for the overview.
  bool include_summaries = 3;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  // Personal workspace first, then by creation time.
  repeated Workspace workspaces = 1;
  // Pending invitations addressed to the caller's email.
  repeated WorkspaceInvitation invitations = 2;
}

message CreateWorkspaceRequest {
  string name = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message RenameWorkspaceRequest {
  string workspace_id = 1;
  string name = 2;
}

// DeleteWorkspaceRequest removes a shared workspace without live projects.
// Its recently deleted projects can no longer be restored and are destroyed.
message DeleteWorkspaceRequest {
  string workspace_id = 1;
  // Must exactly match the workspace's current name.
  string confirmation_name = 2;
}

message ListWorkspaceMembersRequest {
  string workspace_id = 1;
}

message ListWorkspaceMembersResponse {
  repeated WorkspaceMember members = 1;
  repeated WorkspaceInvitation invitations = 2;
}

message InviteWorkspaceMemberRequest {
  string workspace_id = 1;
  string email = 2;
  WorkspaceRole role = 3;
}

message RevokeWorkspaceInvitationRequest {
  string invitation_id = 1;
}

message AcceptWorkspaceInvitationRequest {
  string invitation_id = 1;
}

message DeclineWorkspaceInvitationRequest {
  string invitation_id = 1;
}

message UpdateWorkspaceMemberRoleRequest {
  string workspace_id = 1;
  string user_id = 2;
  WorkspaceRole role = 3;
}

// MoveProjectRequest transfers a project between workspaces. The caller must
// administer the current workspace and be able to create projects in the target.
message MoveProjectRequest {
  string project_id = 1;
  string workspace_id = 2;
}

// Removing yourself leaves the workspace.
message RemoveWorkspaceMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  repeated ProjectSummary summaries = 2;
}

message ProjectSummary {
  Project project = 1;
  int32 environment_count = 2;
  ProjectEnvironmentSummary landing_environment = 3;
  repeated ProjectServiceSummary services = 4;
}

message ProjectEnvironmentSummary {
  string id = 1;
  string name = 2;
}

message ProjectServiceSummary {
  string id = 1;
  string name = 2;
  bool online = 3;
}

message GetProjectRequest {
  string project_id = 1;
}

