syntax = "proto3";

package platform.v1;

option go_package = "ebof-wg-mesh/api/proto/platformv1;platformv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_USER = 1;
  PROJECT_KIND_MANAGED = 2;
}

enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_QUEUED = 1;
  BUILD_STATE_RUNNING = 2;
  BUILD_STATE_SUCCEEDED = 3;
  BUILD_STATE_FAILED = 4;
  BUILD_STATE_SUPERSEDED = 5;
}

enum SourceAccessState {
  SOURCE_ACCESS_STATE_UNSPECIFIED = 0;
  SOURCE_ACCESS_STATE_AVAILABLE = 1;
  SOURCE_ACCESS_STATE_INSTALLATION_REQUIRED = 2;
  SOURCE_ACCESS_STATE_ACCESS_REVOKED = 3;
  SOURCE_ACCESS_STATE_REPOSITORY_DELETED = 4;
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  ProjectKind kind = 4;
  string system_key = 5;
}

message Principal {
  string subject = 1;
  string email = 2;
  google.protobuf.Timestamp created_at = 3;
}

message HealthCheck {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_HTTP = 1;
    TYPE_TCP = 2;
  }

  Type type = 1;
  string path = 2;
  int32 port = 3;
  int32 interval_seconds = 4;
  int32 timeout_seconds = 5;
}

message ServiceRuntimePort {
  int32 port = 1;
  bool primary = 2;
}

message ServiceRuntime {
  repeated string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  int64 cpu_millis = 4;
  int64 memory_mebibytes = 5;
  repeated ServiceRuntimePort ports = 6;
  HealthCheck health_check = 7;
  string volume_name = 8;
}

message DirectImageSource {
  string image = 1;
}

message BuildRecipe {
  string dockerfile_path = 1;
  string context_dir = 2;
}

message ServiceSourceSpec {
  string provider = 1;
  string repository_selector = 2;
  string tracked_ref = 3;
  BuildRecipe build_recipe = 4;
}

message ResolvedSourceBinding {
  string id = 1;
  string service_id = 2;
  string provider = 3;
  string repository_selector = 4;
  string tracked_ref = 5;
  string provider_repository_external_id = 6;
  string provider_scope_external_id = 7;
  SourceAccessState access_state = 8;
  google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp fresh_until = 10;
  BuildRecipe build_recipe = 11;
}

message SourceRevision {
  string id = 1;
  string source_binding_id = 2;
  string provider_repository_external_id = 3;
  string tracked_ref = 4;
  string commit_sha = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message SourceSnapshot {
  string id = 1;
  string source_revision_id = 2;
  string provider_repository_external_id = 3;
  string commit_sha = 4;
  string digest = 5;
  bool ready = 6;
  google.protobuf.Timestamp fetched_at = 7;
}

message BuildJobSource {
  string source_revision_id = 1;
  string source_snapshot_id = 2;
  string source_snapshot_digest = 3;
  BuildRecipe build_recipe = 4;
}

message ServiceSource {
  oneof source {
    DirectImageSource image = 1;
    ServiceSourceSpec source_spec = 2;
  }
}

message ServiceSpec {
  ServiceRuntime runtime = 1;
  ServiceSource source = 2;
}

message ResolvedServiceSpec {
  string image = 1;
  ServiceRuntime runtime = 2;
}

message SourceStateSummary {
  ServiceSourceSpec desired_spec = 1;
  ResolvedSourceBinding resolved_binding = 2;
  SourceRevision latest_revision = 3;
  SourceSnapshot latest_snapshot = 4;
}

message ServiceSourceSummary {
  oneof source {
    DirectImageSource image = 1;
    SourceStateSummary source_state = 2;
  }
}

message BuildStatus {
  string build_id = 1;
  BuildState state = 2;
  string commit_sha = 3;
  string image_digest = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string failure_reason = 8;
}

message Service {
  string id = 1;
  string project_id = 2;
  string name = 3;
  ServiceSpec spec = 4;
  int64 spec_revision = 5;
  string allocated_agent_id = 6;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int64 rollout_generation = 10;
  ServiceSourceSummary source_summary = 11;
  string last_successful_commit_sha = 12;
  string resolved_image = 13;
  BuildStatus latest_build = 14;
}

message DomainBinding {
  string hostname = 1;
  string project_id = 2;
  string service_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 target_port = 6;
}

message Volume {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int64 size_bytes = 4;
  string bound_agent_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Agent {
  string id = 1;
  string name = 2;
  string advertise_addr = 3;
  bool healthy = 4;
  int64 cpu_millis_capacity = 5;
  int64 memory_mebibytes_capacity = 6;
  google.protobuf.Timestamp last_seen_at = 7;
}

message AllocationStatus {
  string allocation_id = 1;
  string service_id = 2;
  string agent_id = 3;
  int64 desired_spec_revision = 4;
  int64 applied_spec_revision = 5;
  string phase = 6;
  string message = 7;
  string allocation_ip = 8;
  bool healthy = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 desired_rollout_generation = 11;
  int64 applied_rollout_generation = 12;
  repeated int32 healthy_ports = 13;
}

message ServiceStatus {
  Service service = 1;
  AllocationStatus allocation = 2;
}

message CreateProjectRequest {
  string name = 1;
}

message EnsurePrincipalRequest {
  string subject = 1;
  string email = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message InspectSourceRequest {
  string provider = 1;
  string repository_selector = 2;
}

message InspectSourceResponse {
  SourceAccessState access_state = 1;
  string default_branch = 2;
  repeated string dockerfile_candidates = 3;
  BuildRecipe recommended_build_recipe = 4;
  repeated int32 recommended_ports = 5;
}

message CreateServiceRequest {
  string project_id = 1;
  ServiceInput service = 2;
}

message UpdateServiceRequest {
  string project_id = 1;
  string service_id = 2;
  ServiceUpdate service = 3;
}

message RedeployServiceRequest {
  string project_id = 1;
  string service_id = 2;
}

message DeleteServiceRequest {
  string project_id = 1;
  string service_id = 2;
}

message GetServiceRequest {
  string project_id = 1;
  string service_id = 2;
}

message ListServicesRequest {
  string project_id = 1;
}

message ListServicesResponse {
  repeated Service services = 1;
}

message CreateVolumeRequest {
  string project_id = 1;
  string name = 2;
  int64 size_bytes = 3;
}

message DeleteVolumeRequest {
  string project_id = 1;
  string volume_id = 2;
}

message ListVolumesRequest {
  string project_id = 1;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message ServiceInput {
  string name = 1;
  ServiceSpec spec = 2;
}

message ServiceUpdate {
  ServiceSpec spec = 1;
  string name = 2;
}

message DomainBindingInput {
  string hostname = 1;
  string service_id = 2;
  int32 target_port = 3;
}

message DomainBindingTarget {
  string service_id = 1;
  int32 target_port = 2;
}

message CreateDomainBindingRequest {
  string project_id = 1;
  DomainBindingInput binding = 2;
}

message GetDomainBindingRequest {
  string project_id = 1;
  string hostname = 2;
}

message ListDomainBindingsRequest {
  string project_id = 1;
  string service_id = 2;
}

message ListDomainBindingsResponse {
  repeated DomainBinding bindings = 1;
}

message UpdateDomainBindingRequest {
  string project_id = 1;
  string hostname = 2;
  DomainBindingTarget binding = 3;
}

message DeleteDomainBindingRequest {
  string project_id = 1;
  string hostname = 2;
}

message GetServiceStatusRequest {
  string project_id = 1;
  string service_id = 2;
}

message ListServiceLogsRequest {
  string project_id = 1;
  string service_id = 2;
  string allocation_id = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  int32 limit = 6;
}

message ServiceLogLine {
  google.protobuf.Timestamp observed_at = 1;
  string project_id = 2;
  string service_id = 3;
  string allocation_id = 4;
  string agent_id = 5;
  string stream = 6;
  int64 rollout_generation = 7;
  uint64 sequence = 8;
  string line = 9;
}

message ListServiceLogsResponse {
  repeated ServiceLogLine lines = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message ClaimBuildRequest {
  string builder_id = 1;
  string builder_name = 2;
}

message BuildJob {
  string build_id = 1;
  string service_id = 2;
  string project_id = 3;
  string service_name = 4;
  string commit_sha = 5;
  BuildJobSource source = 6;
  string registry_push_reference = 7;
  string registry_username = 8;
  string registry_password = 9;
}

message DownloadSourceSnapshotRequest {
  string snapshot_id = 1;
}

message SourceSnapshotArtifact {
  string snapshot_id = 1;
  string digest = 2;
  bytes archive_tgz = 3;
}

message BuilderHeartbeatRequest {
  string builder_id = 1;
  string build_id = 2;
}

message CompleteBuildRequest {
  string builder_id = 1;
  string build_id = 2;
  BuildState state = 3;
  string commit_sha = 4;
  string image_digest = 5;
  string failure_reason = 6;
}

message IngestGitHubWebhookRequest {
  string delivery_id = 1;
  string event_type = 2;
  string signature_256 = 3;
  bytes payload = 4;
}

service PlatformService {
  rpc EnsurePrincipal(EnsurePrincipalRequest) returns (Principal);

  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc InspectSource(InspectSourceRequest) returns (InspectSourceResponse);

  rpc CreateService(CreateServiceRequest) returns (Service);
  rpc UpdateService(UpdateServiceRequest) returns (Service);
  rpc RedeployService(RedeployServiceRequest) returns (ServiceStatus);
  rpc DeleteService(DeleteServiceRequest) returns (google.protobuf.Empty);
  rpc GetService(GetServiceRequest) returns (Service);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);

  rpc CreateVolume(CreateVolumeRequest) returns (Volume);
  rpc DeleteVolume(DeleteVolumeRequest) returns (google.protobuf.Empty);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  rpc CreateDomainBinding(CreateDomainBindingRequest) returns (DomainBinding);
  rpc GetDomainBinding(GetDomainBindingRequest) returns (DomainBinding);
  rpc ListDomainBindings(ListDomainBindingsRequest) returns (ListDomainBindingsResponse);
  rpc UpdateDomainBinding(UpdateDomainBindingRequest) returns (DomainBinding);
  rpc DeleteDomainBinding(DeleteDomainBindingRequest) returns (google.protobuf.Empty);

  rpc GetServiceStatus(GetServiceStatusRequest) returns (ServiceStatus);
  rpc ListServiceLogs(ListServiceLogsRequest) returns (ListServiceLogsResponse);
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse);
}

service BuilderService {
  rpc ClaimBuild(ClaimBuildRequest) returns (BuildJob);
  rpc DownloadSourceSnapshot(DownloadSourceSnapshotRequest) returns (SourceSnapshotArtifact);
  rpc ReportBuildHeartbeat(BuilderHeartbeatRequest) returns (google.protobuf.Empty);
  rpc CompleteBuild(CompleteBuildRequest) returns (google.protobuf.Empty);
}

service OpsService {
  rpc IngestGitHubWebhook(IngestGitHubWebhookRequest) returns (google.protobuf.Empty);
}
