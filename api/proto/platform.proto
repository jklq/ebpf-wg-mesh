syntax = "proto3";

package platform.v1;

option go_package = "ebof-wg-mesh/api/proto/platformv1;platformv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_USER = 1;
  PROJECT_KIND_MANAGED = 2;
}

enum BuildState {
  BUILD_STATE_UNSPECIFIED = 0;
  BUILD_STATE_QUEUED = 1;
  BUILD_STATE_RUNNING = 2;
  BUILD_STATE_SUCCEEDED = 3;
  BUILD_STATE_FAILED = 4;
  BUILD_STATE_SUPERSEDED = 5;
  BUILD_STATE_CANCELLED = 6;
}

enum SourceAccessState {
  SOURCE_ACCESS_STATE_UNSPECIFIED = 0;
  SOURCE_ACCESS_STATE_AVAILABLE = 1;
  SOURCE_ACCESS_STATE_INSTALLATION_REQUIRED = 2;
  SOURCE_ACCESS_STATE_ACCESS_REVOKED = 3;
  SOURCE_ACCESS_STATE_REPOSITORY_DELETED = 4;
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  ProjectKind kind = 4;
  string system_key = 5;
  DeletionState deletion = 6;
}

// DeletionState marks a tombstoned resource. It is absent while the resource
// is live. Delete operations tombstone instead of destroying: the row keeps
// serving reads, new work is refused, ingress and allocations are withdrawn,
// and background garbage collection destroys the row after delete_expires_at.
// When inherited is true the tombstone belongs to an ancestor
// (project/environment/service) and the timestamps identify that tombstone.
message DeletionState {
  google.protobuf.Timestamp deleted_at = 1;
  string deleted_by_user_id = 2;
  google.protobuf.Timestamp delete_expires_at = 3;
  bool inherited = 4;
}

enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_PERSISTENT = 1;
}

message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  EnvironmentKind kind = 4;
  bool is_production = 5;
  string copied_from_environment_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool auto_deploy = 9;
  DeletionState deletion = 10;
}

message HealthCheck {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_HTTP = 1;
  }

  Type type = 1;
  string path = 2;
  int32 port = 3;
  int32 timeout_seconds = 4;
}

enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  RESTART_POLICY_ALWAYS = 1;
  RESTART_POLICY_ON_FAILURE = 2;
  RESTART_POLICY_NEVER = 3;
}

enum RestartCause {
  RESTART_CAUSE_UNSPECIFIED = 0;
  RESTART_CAUSE_EXIT_ZERO = 1;
  RESTART_CAUSE_EXIT_NONZERO = 2;
  RESTART_CAUSE_SIGNAL = 3;
  RESTART_CAUSE_OOM_KILL = 4;
  RESTART_CAUSE_LIVENESS = 5;
  RESTART_CAUSE_OPERATOR = 6;
  RESTART_CAUSE_NODE_LOSS = 7;
  RESTART_CAUSE_DISK_EXHAUSTED = 8;
}

message ServiceRestart {
  RestartPolicy policy = 1;
  int32 max_restarts = 2;
  int32 window_seconds = 3;
  int32 initial_delay_ms = 4;
  int32 max_delay_ms = 5;
  double backoff_multiplier = 6;
  double jitter = 7;
  int32 stable_after_seconds = 8;
}

message RestartObservation {
  int32 restart_count = 1;
  google.protobuf.Timestamp window_started_at = 2;
  google.protobuf.Timestamp last_restart_at = 3;
  google.protobuf.Timestamp next_restart_at = 4;
  google.protobuf.Timestamp started_at = 5;
  RestartCause last_cause = 6;
  int32 last_exit_code = 7;
  int32 last_signal = 8;
  bool crash_loop = 9;
  int64 applied_rollout_generation = 10;
  int64 applied_operator_restart_nonce = 11;
  string message = 12;
  bool awaiting_restart = 13;
}

message ServiceRuntimePort {
  int32 port = 1;
  bool primary = 2;
}

// ServiceRuntime is the customer-facing process contract. It does not accept
// privileged, host-network, host-PID, sysctl, device, or bind-mount input.
message ServiceRuntime {
  repeated string command = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  int64 cpu_millis = 4;
  int64 memory_mebibytes = 5;
  repeated ServiceRuntimePort ports = 6;
  HealthCheck health_check = 7;
  string volume_name = 8;
  ServiceRestart restart = 9;
  HealthCheck liveness_check = 10;
  reserved 11;
  reserved "sandbox_profile";
}

message DirectImageSource {
  string image = 1;
}

enum BuilderKind {
  BUILDER_KIND_UNSPECIFIED = 0;
  BUILDER_KIND_RAILPACK = 1;
  BUILDER_KIND_DOCKERFILE = 2;
}

message BuildRecipe {
  string dockerfile_path = 1;
  string context_dir = 2;
  BuilderKind builder = 3;
}

message ServiceSourceSpec {
  string provider = 1;
  string repository_selector = 2;
  string tracked_ref = 3;
  BuildRecipe build_recipe = 4;
}

message ResolvedSourceBinding {
  string id = 1;
  string service_id = 2;
  string provider = 3;
  string repository_selector = 4;
  string tracked_ref = 5;
  string provider_repository_external_id = 6;
  string provider_scope_external_id = 7;
  SourceAccessState access_state = 8;
  google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp fresh_until = 10;
  BuildRecipe build_recipe = 11;
}

message SourceRevision {
  string id = 1;
  string source_binding_id = 2;
  string provider_repository_external_id = 3;
  string tracked_ref = 4;
  string commit_sha = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message SourceSnapshot {
  string id = 1;
  string source_revision_id = 2;
  string provider_repository_external_id = 3;
  string commit_sha = 4;
  string digest = 5;
  bool ready = 6;
  google.protobuf.Timestamp fetched_at = 7;
}

message BuildJobSource {
  string source_revision_id = 1;
  string source_snapshot_id = 2;
  string source_snapshot_digest = 3;
  BuildRecipe build_recipe = 4;
}

message ServiceSource {
  oneof source {
    DirectImageSource image = 1;
    ServiceSourceSpec source_spec = 2;
  }
}

message ServiceSpec {
  ServiceRuntime runtime = 1;
  ServiceSource source = 2;
  optional int32 desired_replica_count = 3;
  RollingStrategy rolling_strategy = 4;
  // A customer may constrain placement to an operator-defined region. Node
  // labels themselves are never accepted through workload APIs.
  string placement_region = 5;
}

message RollingStrategy {
  optional int32 healthcheck_timeout_seconds = 1;
  optional int32 draining_seconds = 2;
}

message ResolvedServiceSpec {
  string image = 1;
  ServiceRuntime runtime = 2;
}

message SourceStateSummary {
  ServiceSourceSpec desired_spec = 1;
  ResolvedSourceBinding resolved_binding = 2;
  SourceRevision latest_revision = 3;
  SourceSnapshot latest_snapshot = 4;
}

message ServiceSourceSummary {
  oneof source {
    DirectImageSource image = 1;
    SourceStateSummary source_state = 2;
  }
}

enum DeploymentStageState {
  DEPLOYMENT_STAGE_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STAGE_STATE_PENDING = 1;
  DEPLOYMENT_STAGE_STATE_RUNNING = 2;
  DEPLOYMENT_STAGE_STATE_SUCCEEDED = 3;
  DEPLOYMENT_STAGE_STATE_FAILED = 4;
  DEPLOYMENT_STAGE_STATE_SKIPPED = 5;
}

enum DeploymentState {
  DEPLOYMENT_STATE_UNSPECIFIED = 0;
  DEPLOYMENT_STATE_STAGED = 1;
  DEPLOYMENT_STATE_QUEUED_BUILD = 2;
  DEPLOYMENT_STATE_BUILDING = 3;
  DEPLOYMENT_STATE_SCHEDULING = 4;
  DEPLOYMENT_STATE_IMAGE_PULL = 5;
  DEPLOYMENT_STATE_STARTING = 6;
  DEPLOYMENT_STATE_READINESS = 7;
  DEPLOYMENT_STATE_ACTIVE = 8;
  DEPLOYMENT_STATE_DRAINING = 9;
  DEPLOYMENT_STATE_COMPLETED = 10;
  DEPLOYMENT_STATE_FAILED = 11;
  DEPLOYMENT_STATE_CANCELLED = 12;
  DEPLOYMENT_STATE_CRASHED = 13;
  DEPLOYMENT_STATE_REMOVED = 14;
  DEPLOYMENT_STATE_SUPERSEDED = 15;
}

enum DeploymentCauseKind {
  DEPLOYMENT_CAUSE_KIND_UNSPECIFIED = 0;
  DEPLOYMENT_CAUSE_KIND_USER = 1;
  DEPLOYMENT_CAUSE_KIND_SYSTEM = 2;
  DEPLOYMENT_CAUSE_KIND_AGENT = 3;
  DEPLOYMENT_CAUSE_KIND_BUILDER = 4;
  DEPLOYMENT_CAUSE_KIND_WEBHOOK = 5;
}

enum DeploymentAction {
  DEPLOYMENT_ACTION_UNSPECIFIED = 0;
  DEPLOYMENT_ACTION_RESTART = 1;
  DEPLOYMENT_ACTION_EXACT_REDEPLOY = 2;
  DEPLOYMENT_ACTION_ROLLBACK = 3;
  DEPLOYMENT_ACTION_CANCEL = 4;
  DEPLOYMENT_ACTION_REMOVE = 5;
  DEPLOYMENT_ACTION_RETRY = 6;
}

message DeploymentActionRecord {
  string id = 1;
  DeploymentAction action = 2;
  string target_deployment_id = 3;
  string result_deployment_id = 4;
  string allocation_id = 5;
  string requested_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
}

message DeploymentStatus {
  string deployment_id = 1;
  DeploymentState state = 2;
  google.protobuf.Timestamp transitioned_at = 3;
  DeploymentCauseKind cause_kind = 4;
  string cause_id = 5;
  string reason_code = 6;
  string detail = 7;
  int64 spec_revision = 8;
  string image_digest = 9;
  int64 rollout_generation = 10;
}

message DeploymentStage {
  string key = 1;
  string label = 2;
  string detail = 3;
  DeploymentStageState state = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message BuildStatus {
  string build_id = 1;
  BuildState state = 2;
  string commit_sha = 3;
  string image_digest = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  string failure_reason = 8;
  string commit_message = 9;
  string commit_author = 10;
  repeated DeploymentStage stages = 11;
  BuilderKind builder = 12;
  // Lease-based scheduler fields (2.5). attempt_count counts every claim
  // including takeovers; attempt_limit bounds retries of transient worker
  // loss. cancel_requested_at marks cooperative cancellation of a running
  // build: the builder was asked to stop but has not finished yet.
  int64 attempt_count = 13;
  int64 attempt_limit = 14;
  string builder_id = 15;
  google.protobuf.Timestamp lease_expires_at = 16;
  google.protobuf.Timestamp cancel_requested_at = 17;
}

message BuildAttempt {
  int64 attempt_number = 1;
  string builder_id = 2;
  int64 owner_epoch = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  // leased, succeeded, failed_terminal, worker_lost, cancelled, timed_out,
  // superseded.
  string outcome = 6;
  string detail = 7;
}

message ListBuildAttemptsRequest {
  string service_id = 1;
  string build_id = 2;
}

message ListBuildAttemptsResponse {
  repeated BuildAttempt attempts = 1;
}

enum ServiceUnappliedChangeAction {
  SERVICE_UNAPPLIED_CHANGE_ACTION_UNSPECIFIED = 0;
  SERVICE_UNAPPLIED_CHANGE_ACTION_ADD = 1;
  SERVICE_UNAPPLIED_CHANGE_ACTION_UPDATE = 2;
  SERVICE_UNAPPLIED_CHANGE_ACTION_REMOVE = 3;
}

message ServiceUnappliedChange {
  string id = 1;
  string section = 2;
  string field = 3;
  string path = 4;
  ServiceUnappliedChangeAction action = 5;
  string current_value = 6;
  string new_value = 7;
}

message Service {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  ServiceSpec spec = 4;
  int64 spec_revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int64 rollout_generation = 8;
  ServiceSourceSummary source_summary = 9;
  string last_successful_commit_sha = 10;
  string resolved_image = 11;
  BuildStatus latest_build = 12;
  bool pending_changes = 13;
  int32 unapplied_change_count = 14;
  repeated ServiceUnappliedChange unapplied_changes = 15;
  string internal_hostname = 16;
  DeploymentStatus latest_deployment = 17;
  int32 desired_replica_count = 18;
  int32 ready_replica_count = 19;
  string placement_message = 20;
  reserved 21;
  reserved "sandbox_profile_audit";
  DeletionState deletion = 22;
}

enum DomainOwnershipState {
  DOMAIN_OWNERSHIP_STATE_UNSPECIFIED = 0;
  DOMAIN_OWNERSHIP_STATE_VERIFIED = 1;
  DOMAIN_OWNERSHIP_STATE_UNVERIFIED = 2;
}

message DomainBinding {
  string hostname = 1;
  string service_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 target_port = 5;
  bool platform_generated = 6;
  DomainOwnershipState ownership_state = 7;
  string ownership_message = 8;
  DeletionState deletion = 9;
}

message Volume {
  string id = 1;
  string environment_id = 2;
  string name = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
  DeletionState deletion = 6;
}

enum AgentLifecycleState {
  AGENT_LIFECYCLE_STATE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_STATE_ENROLLING = 1;
  AGENT_LIFECYCLE_STATE_ACTIVE = 2;
  AGENT_LIFECYCLE_STATE_CORDONED = 3;
  AGENT_LIFECYCLE_STATE_DRAINING = 4;
  AGENT_LIFECYCLE_STATE_UNAVAILABLE = 5;
  AGENT_LIFECYCLE_STATE_RETIRED = 6;
}

message Agent {
  string id = 1;
  string name = 2;
  string advertise_addr = 3;
  bool healthy = 4;
  int64 cpu_millis_capacity = 5;
  int64 memory_mebibytes_capacity = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  AgentLifecycleState lifecycle_state = 8;
  string region = 9;
  string zone = 10;
  string failure_domain = 11;
  int64 reserved_cpu_millis = 12;
  int64 reserved_memory_mebibytes = 13;
  int64 schedulable_cpu_millis = 14;
  int64 schedulable_memory_mebibytes = 15;
  int64 allocated_cpu_millis = 16;
  int64 allocated_memory_mebibytes = 17;
  int64 headroom_cpu_millis = 18;
  int64 headroom_memory_mebibytes = 19;
  repeated string runtime_capabilities = 20;
  string software_version = 21;
  string version_skew_warning = 22;
  int32 allocation_count = 23;
  string maintenance_message = 24;
  google.protobuf.Timestamp credential_revoked_at = 25;
  string wireguard_endpoint = 26;
}

message AllocationStatus {
  string allocation_id = 1;
  string service_id = 2;
  string agent_id = 3;
  int64 desired_spec_revision = 4;
  int64 applied_spec_revision = 5;
  string phase = 6;
  string message = 7;
  string allocation_ipv4 = 8;
  bool healthy = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 desired_rollout_generation = 11;
  int64 applied_rollout_generation = 12;
  repeated int32 healthy_ipv4_ports = 13;
  RestartObservation restart = 14;
  int64 operator_restart_nonce = 15;
  string rollout_state = 16;
  google.protobuf.Timestamp drain_started_at = 17;
  google.protobuf.Timestamp drain_deadline = 18;
  string allocation_ipv6 = 19;
  repeated int32 healthy_ipv6_ports = 20;
}

message LiveReadMeta {
  int64 accepted_durable_position = 1;
  uint64 applied_live_position = 2;
  google.protobuf.Timestamp observation_freshness = 3;
  bool live_owner_ready = 4;
}

message ServiceStatus {
  Service service = 1;
  AllocationStatus allocation = 2;
  int64 index = 3;
  bool not_modified = 4;
  repeated AllocationStatus allocations = 5;
  LiveReadMeta live = 6;
}

message CreateProjectRequest {
  string name = 1;
}

message ListProjectsRequest {
  bool include_deleted = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
  // Must exactly match the project's current name.
  string confirmation_name = 2;
}

message RestoreProjectRequest {
  string project_id = 1;
}

message PreviewProjectDeletionRequest {
  string project_id = 1;
}

// DeletionPreview reports the live dependents a delete would tombstone. Only
// populated for the resource kind being previewed: project previews fill
// environments, services, domains, and volumes; environment previews fill
// services, domains, and volumes; volume previews fill services and domains.
message DeletionPreview {
  repeated DeletionPreviewEnvironment environments = 1;
  repeated DeletionPreviewService services = 2;
  repeated DeletionPreviewDomain domains = 3;
  repeated DeletionPreviewVolume volumes = 4;
}

message DeletionPreviewEnvironment {
  string id = 1;
  string name = 2;
  bool is_production = 3;
}

message DeletionPreviewService {
  string id = 1;
  string name = 2;
  string environment_id = 3;
  string environment_name = 4;
}

message DeletionPreviewDomain {
  string hostname = 1;
  string service_id = 2;
  string service_name = 3;
  bool platform_generated = 4;
}

message DeletionPreviewVolume {
  string id = 1;
  string name = 2;
  string environment_id = 3;
}

message ListEnvironmentsRequest {
  string project_id = 1;
  bool include_deleted = 2;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message GetEnvironmentRequest {
  string environment_id = 1;
}

message CreateEnvironmentRequest {
  string project_id = 1;
  string name = 2;
}

message DuplicateEnvironmentRequest {
  string source_environment_id = 1;
  string name = 2;
  bool copy_variables = 3;
}

message RenameEnvironmentRequest {
  string environment_id = 1;
  string name = 2;
}

message UpdateEnvironmentAutoDeployRequest {
  string environment_id = 1;
  bool auto_deploy = 2;
}

message DeleteEnvironmentRequest {
  string environment_id = 1;
  // Required for production environments: must exactly match the
  // environment's current name. Ignored for other environments.
  string confirmation_name = 2;
}

message RestoreEnvironmentRequest {
  string environment_id = 1;
}

message PreviewEnvironmentDeletionRequest {
  string environment_id = 1;
}

message ReleaseEnvironmentRequest {
  string environment_id = 1;
}

message ReleaseEnvironmentResponse {
  repeated ServiceStatus services = 1;
}

message InspectSourceRequest {
  string provider = 1;
  string repository_selector = 2;
  string project_id = 3;
  // Transient GitHub OAuth token used by the control plane to verify that the
  // delegated user can read the selected repository. Never persisted.
  string github_user_access_token = 4 [debug_redact = true];
}

message InspectSourceResponse {
  SourceAccessState access_state = 1;
  string default_branch = 2;
  repeated string dockerfile_candidates = 3;
  BuildRecipe recommended_build_recipe = 4;
  repeated int32 recommended_ports = 5;
  string detected_language = 6;
  string detected_start_command = 7;
  string analysis_error = 8;
  BuildRecipe recommended_dockerfile_recipe = 9;
}

message CreateServiceRequest {
  string environment_id = 1;
  ServiceInput service = 2;
}

message UpdateServiceRequest {
  string service_id = 1;
  ServiceUpdate service = 2;
}

message ScaleServiceRequest {
  string service_id = 1;
  int32 desired_replica_count = 2;
}

message ApplyDeploymentActionRequest {
  string service_id = 1;
  string deployment_id = 2;
  DeploymentAction action = 3;
  string idempotency_key = 4;
  string allocation_id = 5;
}

message DiscardServiceChangesRequest {
  string service_id = 1;
  repeated string change_ids = 2;
  bool discard_all = 3;
}

message DeleteServiceRequest {
  string service_id = 1;
}

// SealServiceSecretRequest writes one sealed secret value. The value is
// write-only: it is sealed into ciphertext on write and never returned by
// any read.
message SealServiceSecretRequest {
  string service_id = 1;
  string name = 2;
  string value = 3 [debug_redact = true];
}

message SealServiceSecretResponse {
  string service_id = 1;
  string name = 2;
  int64 version = 3;
}

message DeleteServiceSecretRequest {
  string service_id = 1;
  string name = 2;
}

message ListServiceSecretsRequest {
  string service_id = 1;
}

// ServiceSecretMetadata is the masked existence record for a sealed secret:
// names and versions, never values.
message ServiceSecretMetadata {
  string name = 1;
  int64 version = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListServiceSecretsResponse {
  repeated ServiceSecretMetadata secrets = 1;
}

message RestoreServiceRequest {
  string service_id = 1;
}
message GetServiceRequest {
  string service_id = 1;
}

message ListServicesRequest {
  string environment_id = 1;
  int64 wait_index = 2;
  int32 wait_timeout_seconds = 3;
  bool include_deleted = 4;
}

message ListServicesResponse {
  repeated Service services = 1;
  int64 index = 2;
  bool not_modified = 3;
}

message CreateVolumeRequest {
  string environment_id = 1;
  string name = 2;
  int64 size_bytes = 3;
}

message DeleteVolumeRequest {
  string volume_id = 1;
  // Must exactly match the volume's current name. Volumes are not
  // recoverable: there is no restore, only a grace period before the
  // garbage collector destroys the tombstone.
  string confirmation_name = 2;
}

message PreviewVolumeDeletionRequest {
  string volume_id = 1;
}

message ListVolumesRequest {
  string environment_id = 1;
  bool include_deleted = 2;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message ServiceInput {
  string name = 1;
  ServiceSpec spec = 2;
}

message ServiceUpdate {
  ServiceSpec spec = 1;
  string name = 2;
}

message DomainBindingInput {
  string hostname = 1;
  string service_id = 2;
  int32 target_port = 3;
}

message DomainBindingTarget {
  string service_id = 1;
  int32 target_port = 2;
}

message GenerateDomainBindingRequest {
  string service_id = 1;
  int32 target_port = 2;
}

message CreateDomainBindingRequest {
  DomainBindingInput binding = 1;
}

message GetDomainBindingRequest {
  string hostname = 1;
}

message ListDomainBindingsRequest {
  string service_id = 1;
  bool include_deleted = 2;
}

message ListDomainBindingsResponse {
  repeated DomainBinding bindings = 1;
}

message UpdateDomainBindingRequest {
  string hostname = 1;
  DomainBindingTarget binding = 2;
}

message DeleteDomainBindingRequest {
  string hostname = 1;
}

message RestoreDomainBindingRequest {
  string hostname = 1;
}

message GetServiceStatusRequest {
  string service_id = 1;
  int64 wait_index = 2;
  int32 wait_timeout_seconds = 3;
}

enum ServiceLogType {
  SERVICE_LOG_TYPE_UNSPECIFIED = 0;
  SERVICE_LOG_TYPE_RUNTIME = 1;
  SERVICE_LOG_TYPE_BUILD = 2;
  SERVICE_LOG_TYPE_DEPLOY = 3;
  SERVICE_LOG_TYPE_HTTP = 4;
  SERVICE_LOG_TYPE_NETWORK = 5;
}

message ListServiceLogsRequest {
  string service_id = 1;
  string allocation_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 limit = 5;
  ServiceLogType log_type = 6;
  string build_id = 7;
  string search = 8;
}

message ServiceLogLine {
  google.protobuf.Timestamp observed_at = 1;
  string environment_id = 2;
  string service_id = 3;
  string allocation_id = 4;
  string agent_id = 5;
  string stream = 6;
  int64 rollout_generation = 7;
  uint64 sequence = 8;
  string line = 9;
  ServiceLogType log_type = 10;
  string build_id = 11;
  string stage = 12;
}

message ListServiceLogsResponse {
  repeated ServiceLogLine lines = 1;
}

message ListServiceDeploymentsRequest {
  string service_id = 1;
  int32 limit = 2;
}

message DeploymentRecord {
  string id = 1;
  string service_id = 2;
  int64 rollout_generation = 3;
  int64 spec_revision = 4;
  google.protobuf.Timestamp created_at = 6;
  BuildStatus build = 7;
  bool is_current = 8;
  string requested_by_user_id = 9;
  DeploymentStatus status = 10;
  repeated DeploymentStage stages = 11;
  string image_digest = 12;
  repeated DeploymentActionRecord actions = 13;
  map<string, int64> variable_versions = 14;
  // Sealed secret name to sealed version pins captured at deploy time.
  // Kept separate from variable_versions (public env keys to spec revision)
  // so a name that moves between public and sealed can never collide.
  map<string, int64> sealed_versions = 15;
}

message ListServiceDeploymentsResponse {
  repeated DeploymentRecord deployments = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  LiveReadMeta live = 2;
}

message CreateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string region = 3;
  string zone = 4;
  string failure_domain = 5;
  int64 reserved_cpu_millis = 6;
  int64 reserved_memory_mebibytes = 7;
}

message AgentEnrollment {
  Agent agent = 1;
  string bootstrap_token = 2 [debug_redact = true];
}

message UpdateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string region = 3;
  string zone = 4;
  string failure_domain = 5;
  int64 reserved_cpu_millis = 6;
  int64 reserved_memory_mebibytes = 7;
}

message SetAgentLifecycleRequest {
  string agent_id = 1;
  AgentLifecycleState lifecycle_state = 2;
}

message FleetCapacity {
  int32 node_count = 1;
  int32 schedulable_node_count = 2;
  int64 schedulable_cpu_millis = 3;
  int64 schedulable_memory_mebibytes = 4;
  int64 allocated_cpu_millis = 5;
  int64 allocated_memory_mebibytes = 6;
  int64 headroom_cpu_millis = 7;
  int64 headroom_memory_mebibytes = 8;
}

message Fleet {
  repeated Agent agents = 1;
  FleetCapacity capacity = 2;
  string version_warning = 3;
  LiveReadMeta live = 4;
}

message ClaimBuildRequest {
  string builder_id = 1;
  string builder_name = 2;
}

message BuildJob {
  string build_id = 1;
  string service_id = 2;
  string project_id = 3;
  string service_name = 4;
  string commit_sha = 5;
  BuildJobSource source = 6;
  string registry_push_reference = 7;
  string registry_username = 8;
  string registry_password = 9;
  string environment_id = 10;
  // Lease fencing (2.5). The builder must present lease_epoch on every
  // heartbeat, log report, and completion; the control plane commits only
  // by compare-and-swap on the current epoch.
  int64 lease_epoch = 11;
  google.protobuf.Timestamp lease_expires_at = 12;
  google.protobuf.Timestamp deadline_at = 13;
}

message DownloadSourceSnapshotRequest {
  string snapshot_id = 1;
}

message SourceSnapshotChunk {
  string snapshot_id = 1;
  string digest = 2;
  int64 total_size = 3;
  int64 offset = 4;
  bytes data = 5;
}

message BuilderHeartbeatRequest {
  string builder_id = 1;
  string build_id = 2;
  int64 lease_epoch = 3;
}

message ReportBuildLogsRequest {
  string builder_id = 1;
  string build_id = 2;
  repeated BuildLogLine lines = 3;
  int64 lease_epoch = 4;
}

message BuildLogLine {
  google.protobuf.Timestamp observed_at = 1;
  string stream = 2;
  uint64 sequence = 3;
  string line = 4;
}

message CompleteBuildRequest {
  string builder_id = 1;
  string build_id = 2;
  BuildState state = 3;
  string commit_sha = 4;
  string image_digest = 5;
  string failure_reason = 6;
  int64 lease_epoch = 7;
}

message IngestGitHubWebhookRequest {
  string delivery_id = 1;
  string event_type = 2;
  string signature_256 = 3;
  bytes payload = 4;
}

message LinkGitHubRepositoryRequest {
  string project_id = 1;
  string repository_selector = 2;
  // Transient GitHub OAuth token used by the control plane to verify that the
  // delegated user can read the selected repository. Never persisted.
  string github_user_access_token = 3 [debug_redact = true];
}

service PlatformService {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);
  rpc RestoreProject(RestoreProjectRequest) returns (Project);
  rpc PreviewProjectDeletion(PreviewProjectDeletionRequest) returns (DeletionPreview);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (Environment);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (Environment);
  rpc DuplicateEnvironment(DuplicateEnvironmentRequest) returns (Environment);
  rpc RenameEnvironment(RenameEnvironmentRequest) returns (Environment);
  rpc UpdateEnvironmentAutoDeploy(UpdateEnvironmentAutoDeployRequest) returns (Environment);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (google.protobuf.Empty);
  rpc RestoreEnvironment(RestoreEnvironmentRequest) returns (Environment);
  rpc PreviewEnvironmentDeletion(PreviewEnvironmentDeletionRequest) returns (DeletionPreview);
  rpc ReleaseEnvironment(ReleaseEnvironmentRequest) returns (ReleaseEnvironmentResponse);
  rpc LinkGitHubRepository(LinkGitHubRepositoryRequest) returns (InspectSourceResponse);
  rpc InspectSource(InspectSourceRequest) returns (InspectSourceResponse);

  rpc CreateService(CreateServiceRequest) returns (Service);
  rpc UpdateService(UpdateServiceRequest) returns (Service);
  rpc ScaleService(ScaleServiceRequest) returns (ServiceStatus);
  rpc ApplyDeploymentAction(ApplyDeploymentActionRequest) returns (ServiceStatus);
  rpc DiscardServiceChanges(DiscardServiceChangesRequest) returns (Service);
  rpc DeleteService(DeleteServiceRequest) returns (google.protobuf.Empty);
  rpc RestoreService(RestoreServiceRequest) returns (Service);
  rpc GetService(GetServiceRequest) returns (Service);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);

  rpc SealServiceSecret(SealServiceSecretRequest) returns (SealServiceSecretResponse);
  rpc DeleteServiceSecret(DeleteServiceSecretRequest) returns (google.protobuf.Empty);
  rpc ListServiceSecrets(ListServiceSecretsRequest) returns (ListServiceSecretsResponse);

  rpc CreateVolume(CreateVolumeRequest) returns (Volume);
  rpc DeleteVolume(DeleteVolumeRequest) returns (google.protobuf.Empty);
  rpc PreviewVolumeDeletion(PreviewVolumeDeletionRequest) returns (DeletionPreview);
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  rpc CreateDomainBinding(CreateDomainBindingRequest) returns (DomainBinding);
  rpc GenerateDomainBinding(GenerateDomainBindingRequest) returns (DomainBinding);
  rpc GetDomainBinding(GetDomainBindingRequest) returns (DomainBinding);
  rpc ListDomainBindings(ListDomainBindingsRequest) returns (ListDomainBindingsResponse);
  rpc UpdateDomainBinding(UpdateDomainBindingRequest) returns (DomainBinding);
  rpc DeleteDomainBinding(DeleteDomainBindingRequest) returns (google.protobuf.Empty);
  rpc RestoreDomainBinding(RestoreDomainBindingRequest) returns (DomainBinding);

  rpc GetServiceStatus(GetServiceStatusRequest) returns (ServiceStatus);
  rpc ListServiceLogs(ListServiceLogsRequest) returns (ListServiceLogsResponse);
  rpc ListServiceDeployments(ListServiceDeploymentsRequest) returns (ListServiceDeploymentsResponse);
  rpc ListAgents(google.protobuf.Empty) returns (ListAgentsResponse);
  rpc ListBuildAttempts(ListBuildAttemptsRequest) returns (ListBuildAttemptsResponse);
}

message BuilderWorker {
  string id = 1;
  string name = 2;
  string current_build_id = 3;
  google.protobuf.Timestamp last_heartbeat_at = 4;
  bool drained = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ListBuildersResponse {
  repeated BuilderWorker builders = 1;
}

message SetBuilderDrainRequest {
  string builder_id = 1;
  bool drained = 2;
}

message BuildSchedulerState {
  bool paused = 1;
  int64 running_builds = 2;
  int64 queued_builds = 3;
  int32 max_concurrent_global = 4;
  int32 max_concurrent_per_project = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SetBuildSchedulerPausedRequest {
  bool paused = 1;
}

service BuilderService {
  rpc ClaimBuild(ClaimBuildRequest) returns (BuildJob);
  rpc DownloadSourceSnapshot(DownloadSourceSnapshotRequest) returns (stream SourceSnapshotChunk);
  rpc ReportBuildHeartbeat(BuilderHeartbeatRequest) returns (google.protobuf.Empty);
  rpc ReportBuildLogs(ReportBuildLogsRequest) returns (google.protobuf.Empty);
  rpc CompleteBuild(CompleteBuildRequest) returns (google.protobuf.Empty);
}

service OpsService {
  rpc IngestGitHubWebhook(IngestGitHubWebhookRequest) returns (google.protobuf.Empty);
  rpc ListFleet(google.protobuf.Empty) returns (Fleet);
  rpc CreateAgent(CreateAgentRequest) returns (AgentEnrollment);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc SetAgentLifecycle(SetAgentLifecycleRequest) returns (Agent);
  rpc ListBuilders(google.protobuf.Empty) returns (ListBuildersResponse);
  rpc SetBuilderDrain(SetBuilderDrainRequest) returns (BuilderWorker);
  rpc GetBuildScheduler(google.protobuf.Empty) returns (BuildSchedulerState);
  rpc SetBuildSchedulerPaused(SetBuildSchedulerPausedRequest) returns (BuildSchedulerState);
}
