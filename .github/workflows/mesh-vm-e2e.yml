name: Privileged mesh VM e2e

on:
  workflow_dispatch:
    inputs:
      location:
        description: Hetzner location
        required: true
        default: nbg1
        type: string

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  mesh-isolation:
    name: Linux containerd, WireGuard, and eBPF isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: mesh-vm-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: opentofu/setup-opentofu@v1
      - name: Run VM rollout and cross-project isolation scenario
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: go run ./cmd/testvm -location "${{ inputs.location }}" -run-id "gha-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-vm-e2e-${{ github.run_id }}
          path: artifacts/e2e-vm
          if-no-files-found: warn
          retention-days: 14
