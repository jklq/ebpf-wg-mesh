name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  BUN_VERSION: 1.3.11

jobs:
  unit:
    name: Format, typecheck, and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install console dependencies
        run: bun --cwd=console install --frozen-lockfile
      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Check console formatting and lint
        run: bun --cwd=console run check
      - name: Typecheck console
        run: bun --cwd=console run typecheck
      - name: Run Go unit tests
        run: make test-unit-go
      - name: Run console unit tests
        run: make test-unit-console

  linux-runtime:
    name: Privileged containerd and eBPF tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install containerd, CNI, and privileged dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes containerd containernetworking-plugins iproute2 iptables
          sudo mkdir -p /usr/lib/cni /etc/cni/net.d
          if [ -d /opt/cni/bin ] && [ ! -e /usr/lib/cni/bridge ]; then
            sudo ln -sfn /opt/cni/bin/* /usr/lib/cni/
          fi
          sudo tee /etc/cni/net.d/10-mesh-cni.conflist >/dev/null <<'EOF'
          {
            "cniVersion": "1.0.0",
            "name": "mesh-cni",
            "plugins": [
              {
                "type": "bridge",
                "bridge": "mesh0",
                "isGateway": true,
                "ipMasq": false,
                "promiscMode": true,
                "ipam": {
                  "type": "host-local",
                  "ranges": [[{ "subnet": "fd00:200::/48" }]],
                  "routes": [{ "dst": "::/0" }]
                }
              },
              { "type": "loopback" }
            ]
          }
          EOF
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          sudo sysctl -w net.ipv6.conf.default.forwarding=1
          sudo systemctl enable --now containerd
          sudo ctr images pull docker.io/library/busybox:1.36.1
      - name: Run containerd engine and eBPF policy tests
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:/usr/local/go/bin:$PATH"
          sudo --preserve-env=PATH,HOME,GOROOT,GOPATH,GOCACHE,GOMODCACHE,GOPROXY,GOSUMDB \
            "$(command -v go)" test -count=1 -timeout 10m -v ./internal/agent
          sudo --preserve-env=PATH,HOME,GOROOT,GOPATH,GOCACHE,GOMODCACHE,GOPROXY,GOSUMDB \
            "$(command -v go)" test -count=1 -timeout 10m -v ./internal/firewall

  integration:
    name: CockroachDB integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install test tools and console dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep zsh
          bun --cwd=console install --frozen-lockfile
      - name: Run real CockroachDB integration suites
        run: make test-integration

  product-e2e:
    name: Local product e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install console dependencies
        run: bun --cwd=console install --frozen-lockfile
      - name: Install Chromium and system dependencies
        working-directory: console
        run: bunx playwright install --with-deps chromium
      - name: Run control-plane, agent, Docker, Caddy, ClickHouse, and browser e2e
        run: make test-e2e-local
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-product
          path: console/artifacts/e2e-local
          if-no-files-found: warn
          retention-days: 7
