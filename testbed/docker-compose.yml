services:
  clustera-node1:
    build:
      context: ..
      dockerfile: testbed/Dockerfile
    image: ebof-wg-mesh-node:latest
    container_name: mesh-clustera-node1
    privileged: true
    entrypoint: ["/testbed/scripts/node-entrypoint.sh"]
    command: ["/config/clustera-node1.yaml"]
    environment:
      NODE_NAME: clustera-node1
      CNI_NETWORK_NAME: mesh-cni
      CNI_SUBNET: 10.200.1.0/24
      CNI_GATEWAY: 10.200.1.1
      MESH_ROUTE_CIDR: 10.201.0.0/16
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ./config/clustera-node1.yaml:/config/clustera-node1.yaml:ro
      - ./scripts:/testbed/scripts:ro
    networks:
      underlay:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD-SHELL", "ctr version >/dev/null 2>&1 && ip link show wg0 | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40

  clustera-node2:
    image: ebof-wg-mesh-node:latest
    container_name: mesh-clustera-node2
    privileged: true
    entrypoint: ["/testbed/scripts/node-entrypoint.sh"]
    command: ["/config/clustera-node2.yaml"]
    environment:
      NODE_NAME: clustera-node2
      CNI_NETWORK_NAME: mesh-cni
      CNI_SUBNET: 10.200.2.0/24
      CNI_GATEWAY: 10.200.2.1
      MESH_ROUTE_CIDR: 10.201.0.0/16
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ./config/clustera-node2.yaml:/config/clustera-node2.yaml:ro
      - ./scripts:/testbed/scripts:ro
    networks:
      underlay:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "ctr version >/dev/null 2>&1 && ip link show wg0 | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      - clustera-node1

  clusterb-node1:
