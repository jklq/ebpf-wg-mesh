    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
    volumes:
      - ./config/clusterb-node1.yaml:/config/clusterb-node1.yaml:ro
      - ./scripts:/testbed/scripts:ro
    networks:
      underlay:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD-SHELL", "ctr version >/dev/null 2>&1 && ip link show wg0 | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      - clustera-node1

  clusterb-node2:
    image: ebof-wg-mesh-node:latest
    container_name: mesh-clusterb-node2
    privileged: true
    entrypoint: ["/testbed/scripts/node-entrypoint.sh"]
